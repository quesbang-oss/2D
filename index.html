   自然言語モーション（ルールベース）
   ============================================================ */
const NLMotion = {
  dialog() {
    const h = `<div class="hint">やりたい動きを日本語で書いてください。選択中のオブジェクトに、現在の再生ヘッド位置からキーフレームを作成します。</div>
    <textarea id="nlbox" placeholder="2秒かけて右に300px移動"></textarea>
    <div class="small" style="margin-top:6px">例：<br>
    ・2秒かけて右に300px移動<br>
    ・1秒かけて2倍にする<br>
    ・3秒かけて右回転して元に戻す<br>
    ・0.5秒でフェードイン<br>
    ・1秒で上に200移動してから元に戻る<br>
    ・3回揺れる／バウンドする／ジャンプする</div>
    <div class="small" id="nlresult" style="margin-top:8px"></div>`;
    UI.dialog('文章から動きを作る', h, [['閉じる', null], ['作成', () => { this.run($('#nlbox').value); return true; }, true]]);
    setTimeout(() => {
      const b = $('#nlbox'); if (!b) return; b.focus();
      b.oninput = () => { const r = this.parse(b.value); $('#nlresult').innerHTML = r.ok ? '解釈：' + esc(r.desc) : '<span style="color:var(--warn)">まだ解釈できていません。「○秒かけて右に○px移動」のように書いてみてください。</span>'; };
    }, 30);
  },
  parse(text) {
    const s = (text || '').trim();
    if (!s) return { ok: false };
    const out = { dur: 1, ops: [], back: /元に(戻|もど)/.test(s), ease: 'easeInOut', desc: '' };
    let m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*秒/);
    if (m) out.dur = clamp(parseFloat(m[1]), .05, 120);
    if (/ゆっくり|なめらか/.test(s)) out.ease = 'easeInOut';
    if (/だんだん速く|加速/.test(s)) out.ease = 'easeIn';
    if (/だんだん遅く|減速/.test(s)) out.ease = 'easeOut';
    if (/一定|リニア|直線的/.test(s)) out.ease = 'linear';
    if (/カクカク|パラパラ|ステップ/.test(s)) out.ease = 'step';
    // 移動
    const dir = s.match(/(右上|右下|左上|左下|右|左|上|下)(?:に|へ)?\s*([0-9]+(?:\.[0-9]+)?)?\s*(?:px|ピクセル)?/);
    if (dir && (/(移動|動かす|動く|ずら|進む|行く|移す)/.test(s) || dir[2])) {
      const amt = dir[2] ? parseFloat(dir[2]) : 200;
      const map = { '右': [1, 0], '左': [-1, 0], '上': [0, -1], '下': [0, 1], '右上': [.7, -.7], '右下': [.7, .7], '左上': [-.7, -.7], '左下': [-.7, .7] };
      const v = map[dir[1]];
      out.ops.push({ kind: 'move', dx: v[0] * amt, dy: v[1] * amt });
    }
    // スケール
    let sm = s.match(/([0-9]+(?:\.[0-9]+)?)\s*倍/);
    if (sm) out.ops.push({ kind: 'scale', f: parseFloat(sm[1]) });
    else if (/拡大|大きく/.test(s)) out.ops.push({ kind: 'scale', f: 1.5 });
    else if (/縮小|小さく/.test(s)) out.ops.push({ kind: 'scale', f: .5 });
    // 回転
    if (/回転|回る|回す|スピン/.test(s)) {
      let a = 360;
      const dm = s.match(/([0-9]+(?:\.[0-9]+)?)\s*度/); if (dm) a = parseFloat(dm[1]);
      else { const rm = s.match(/([0-9]+(?:\.[0-9]+)?)\s*回/); if (rm) a = parseFloat(rm[1]) * 360; }
      if (/左回転|反時計/.test(s)) a = -a;
      out.ops.push({ kind: 'rotate', deg: a });
    }
    // 不透明度
    if (/フェードイン|現れ|出現|表示され/.test(s)) out.ops.push({ kind: 'fade', from: 0, to: 1 });
    if (/フェードアウト|消える|消え|非表示/.test(s)) out.ops.push({ kind: 'fade', from: 1, to: 0 });
    // 特殊
    const times = (s.match(/([0-9]+)\s*回/) || [])[1];
    if (/揺れ|振動|ぶるぶる|シェイク/.test(s)) out.ops.push({ kind: 'shake', n: times ? +times : 4 });
    if (/バウンド|跳ね|弾む/.test(s)) out.ops.push({ kind: 'bounce', n: times ? +times : 3 });
    if (/ジャンプ/.test(s)) out.ops.push({ kind: 'jump' });
    if (!out.ops.length) return { ok: false };
    out.desc = out.dur + '秒 / ' + out.ops.map(o => ({ move: '移動', scale: '拡大縮小', rotate: '回転', fade: 'フェード', shake: '揺れ', bounce: 'バウンド', jump: 'ジャンプ' })[o.kind]).join('・') + (out.back ? '（最後に元へ戻す）' : '');
    return Object.assign({ ok: true }, out);
  },
  run(text) {
    const r = this.parse(text);
    if (!r.ok) { Toast.warn('文章を解釈できませんでした', '「2秒かけて右に300px移動」のような書き方でお試しください。'); return; }
    const objs = selected();
    if (!objs.length) { Toast.warn('オブジェクトを選択してください'); return; }
    const t0 = State.time, dur = r.dur;
    objs.forEach(o => {
      const end = r.back ? t0 + dur : t0 + dur;
      const mid = r.back ? t0 + dur / 2 : end;
      r.ops.forEach(op => {
        if (op.kind === 'move') {
          const x = getProp(o, 'x', t0), y = getProp(o, 'y', t0);
          setKey(o, 'x', t0, x, r.ease); setKey(o, 'y', t0, y, r.ease);
          setKey(o, 'x', mid, round(x + op.dx, 2), r.ease); setKey(o, 'y', mid, round(y + op.dy, 2), r.ease);
          if (r.back) { setKey(o, 'x', end, x, r.ease); setKey(o, 'y', end, y, r.ease); }
        } else if (op.kind === 'scale') {
          const sx = getProp(o, 'sx', t0), sy = getProp(o, 'sy', t0);
          setKey(o, 'sx', t0, sx, r.ease); setKey(o, 'sy', t0, sy, r.ease);
          setKey(o, 'sx', mid, round(sx * op.f, 4), r.ease); setKey(o, 'sy', mid, round(sy * op.f, 4), r.ease);
          if (r.back) { setKey(o, 'sx', end, sx, r.ease); setKey(o, 'sy', end, sy, r.ease); }
        } else if (op.kind === 'rotate') {
          const rr = getProp(o, 'rot', t0);
          setKey(o, 'rot', t0, rr, r.ease);
          setKey(o, 'rot', mid, round(rr + op.deg, 2), r.ease);
          if (r.back) setKey(o, 'rot', end, rr, r.ease);
        } else if (op.kind === 'fade') {
          setKey(o, 'opacity', t0, op.from, r.ease);
          setKey(o, 'opacity', t0 + dur, op.to, r.ease);
        } else if (op.kind === 'shake') {
          const x = getProp(o, 'x', t0), n = clamp(op.n, 1, 30), step = dur / (n * 2);
          setKey(o, 'x', t0, x, 'linear');
          for (let i = 1; i <= n * 2; i++) setKey(o, 'x', round(t0 + step * i, 4), round(x + (i % 2 ? 16 : -16) * (1 - i / (n * 2 + 1)), 2), 'linear');
          setKey(o, 'x', t0 + dur, x, 'linear');
        } else if (op.kind === 'bounce') {
          const y = getProp(o, 'y', t0), n = clamp(op.n, 1, 10), step = dur / n;
          setKey(o, 'y', t0, y, 'easeOut');
          for (let i = 0; i < n; i++) {
            const amp = 120 * Math.pow(.55, i);
            setKey(o, 'y', round(t0 + step * (i + .5), 4), round(y - amp, 2), 'easeOut');
            setKey(o, 'y', round(t0 + step * (i + 1), 4), y, 'easeIn');
          }
        } else if (op.kind === 'jump') {
          const y = getProp(o, 'y', t0);
          setKey(o, 'y', t0, y, 'easeOut');
          setKey(o, 'y', round(t0 + dur / 2, 4), round(y - 200, 2), 'easeOut');
          setKey(o, 'y', round(t0 + dur, 4), y, 'easeIn');
        }
      });
    });
    if (scene().duration < t0 + dur) scene().duration = Math.ceil(t0 + dur);
    commit('文章からモーション作成');
    UI.refreshAll();
    Toast.ok('モーションを作成しました', r.desc);
  }
};

   ショートカット
   ============================================================ */
let SHORTCUTS = {
  'ctrl+z': 'undo', 'ctrl+y': 'redo', 'ctrl+shift+z': 'redo', 'ctrl+c': 'copy', 'ctrl+v': 'paste',
  'ctrl+d': 'duplicate', 'ctrl+s': 'save', 'ctrl+o': 'open', 'ctrl+n': 'newProject', 'ctrl+e': 'export',
  'ctrl+a': 'selectAll', 'delete': 'del', 'backspace': 'del', ' ': 'play', 'k': 'key',
  'g': 'grid', 'r': 'ruler', 'm': 'marker', 'o': 'onion', 'f': 'zoomFit', 'ctrl+g': 'addGroup'
};
function keyLabel(k) {
  return k.replace('ctrl+', 'Ctrl+').replace('shift+', 'Shift+').replace(/^ $/, 'Space')
    .replace('delete', 'Delete').replace('backspace', 'Backspace').replace(/^([a-z])$/, (m, c) => c.toUpperCase());
}
function keyString(e) {
  let s = '';
  if (e.ctrlKey || e.metaKey) s += 'ctrl+';
  if (e.shiftKey && e.key.length > 1) s += 'shift+';
  else if (e.shiftKey && /^[a-z]$/i.test(e.key)) s += 'shift+';
  s += e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  return s;
}
function bindKeys() {
  window.addEventListener('keydown', guard(e => {
    if (e.key === ' ') Keys.space = true;
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag)) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    const k = keyString(e);
    // ツール
    const toolKeys = { v: 'select', a: 'anchor', b: 'bone', p: 'pen', n: 'brush', e: 'eraser', i: 'eyedrop' };
    if (!e.ctrlKey && !e.metaKey && toolKeys[e.key.toLowerCase()] && !['g'].includes(e.key.toLowerCase())) { setTool(toolKeys[e.key.toLowerCase()]); e.preventDefault(); return; }
    if (!e.ctrlKey && e.key.toLowerCase() === 'g' && !e.shiftKey) { setTool('fill'); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft') { Player.stepFrame(-1); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { Player.stepFrame(1); e.preventDefault(); return; }
    if (e.key === 'Home') { Player.first(); e.preventDefault(); return; }
    if (e.key === 'End') { Player.last(); e.preventDefault(); return; }
    if (e.key === 'Escape') { UI.closeDialog(); if (Draw.polyPts) { Draw.polyPts = null; Canvas.needRender = true; } return; }
    const act = SHORTCUTS[k] || (e.key === ' ' ? 'play' : null);
    if (act && ACTIONS[act]) { e.preventDefault(); ACTIONS[act][1](); }
  }, 'keydown'));
  window.addEventListener('keyup', e => { if (e.key === ' ') Keys.space = false; });
}
function shortcutDialog() {
  const rows = Object.keys(ACTIONS).map(a => {
    const k = Object.keys(SHORTCUTS).find(sk => SHORTCUTS[sk] === a) || '';
    return '<div class="prow"><label style="width:180px">' + esc(ACTIONS[a][0]) + '</label><div class="f"><input type="text" class="sk" data-a="' + a + '" value="' + keyLabel(k) + '" readonly placeholder="クリックしてキーを押す"></div></div>';
  }).join('');
  UI.dialog('ショートカット設定', '<div class="hint">項目をクリックしてから、割り当てたいキーを押してください。</div>' + rows, [['閉じる', null]]);
  setTimeout(() => $$('.sk').forEach(el => {
    el.onkeydown = e => {
      e.preventDefault();
      const k = keyString(e);
      Object.keys(SHORTCUTS).forEach(sk => { if (SHORTCUTS[sk] === el.dataset.a) delete SHORTCUTS[sk]; });
      SHORTCUTS[k] = el.dataset.a; el.value = keyLabel(k);
      try { localStorage.setItem('k2d_shortcuts', JSON.stringify(SHORTCUTS)); } catch (err) { }
      buildMenus();
    };
  }), 20);
}

function makeSplitter(el, target, dir, min, max, invert) {
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    const start = dir === 'x' ? e.clientX : e.clientY;
    const t = $(target);
    const size0 = dir === 'x' ? t.offsetWidth : t.offsetHeight;
    const mv = ev => {
      const d = ((dir === 'x' ? ev.clientX : ev.clientY) - start) * (invert ? -1 : 1);
      const v = clamp(size0 + d, min, max);
      if (dir === 'x') t.style.width = v + 'px'; else t.style.height = v + 'px';
      Canvas.resize(); Timeline.resize(); GraphEditor.resize();
    };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });
}

/* ============================================================
   起動
   ============================================================ */
function bindUI() {
  buildTools(); buildMenus(); bindKeys();
  setTool('select');
  $$('.tab').forEach(el => el.onclick = () => {
    $$('.tab').forEach(x => x.classList.remove('on')); el.classList.add('on');
    $$('.tabbody').forEach(b => b.classList.remove('on'));
    $('#tb-' + el.dataset.tab).classList.add('on');
  });
  $('#btn-import').onclick = () => $('#fileinput').click();
  $('#fileinput').onchange = async e => { const f = Array.from(e.target.files); e.target.value = ''; if (f.length) await AssetsUI.importFiles(f); };
  $('#projinput').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await openProjectFile(f); };
  $('#btn-newfolder').onclick = () => UI.prompt('フォルダ名', '新しいフォルダ', v => {
    P().folders.push({ id: uid('fd'), name: v, parent: AssetsUI.folder }); commit('フォルダ作成'); AssetsUI.refresh();
  });
  $('#assetsearch').oninput = e => { AssetsUI.search = e.target.value; AssetsUI.refresh(); };
  $('#btn-addgroup').onclick = () => ObjOps.addGroup();
  $('#btn-adddraw').onclick = () => ObjOps.addDrawLayer();
  $('#btn-addbone').onclick = () => ObjOps.addBone();
  $('#btn-dupobj').onclick = () => ObjOps.duplicate(selected(), true);
  $('#btn-delobj').onclick = () => ObjOps.remove(selected());
  $('#btn-addscene').onclick = () => {
    const s = newScene('シーン ' + String(P().scenes.length + 1).padStart(2, '0'));
    P().scenes.push(s); commit('シーン追加'); switchScene(s.id);
  };
  $('#btn-dupscene').onclick = () => {
    const s = deepClone(scene()); s.id = uid('sc'); s.name += ' コピー';
    s.objects.forEach(o => { const old = o.id; o.id = uid('ob'); s.objects.forEach(c => { if (c.parentId === old) c.parentId = o.id; }); });
    P().scenes.push(s); commit('シーン複製'); switchScene(s.id);
  };
  $('#btn-delscene').onclick = () => {
    if (P().scenes.length <= 1) { Toast.warn('最後のシーンは削除できません'); return; }
    UI.confirm('シーンを削除しますか？', scene().name, () => {
      P().scenes = P().scenes.filter(s => s.id !== P().activeScene);
      P().activeScene = P().scenes[0].id; commit('シーン削除'); switchScene(P().activeScene);
    });
  };
  $('#btn-savepreset').onclick = () => Presets.save();
  // キャンバス上部
  $('#btn-zoomin').onclick = () => Canvas.zoomAt(1.25, Canvas.wrap.clientWidth / 2, Canvas.wrap.clientHeight / 2);
  $('#btn-zoomout').onclick = () => Canvas.zoomAt(.8, Canvas.wrap.clientWidth / 2, Canvas.wrap.clientHeight / 2);
  $('#btn-zoomfit').onclick = () => Canvas.zoomFit();
  ['grid', 'snap', 'ruler', 'safe', 'onion', 'path'].forEach(k => $('#btn-' + k).onclick = () => ACTIONS[k][1]());
  $('#btn-snap').classList.add('on'); $('#btn-path').classList.add('on');
  // 再生
  $('#btn-play').onclick = () => Player.toggle();
  $('#btn-first').onclick = () => Player.first();
  $('#btn-last').onclick = () => Player.last();
  $('#btn-prevf').onclick = () => Player.stepFrame(-1);
  $('#btn-nextf').onclick = () => Player.stepFrame(1);
  $('#btn-loop').onclick = () => { State.loop = !State.loop; $('#btn-loop').classList.toggle('on', State.loop); };
  $('#playspeed').onchange = e => State.speed = +e.target.value;
  $('#chk-autokey').onchange = e => { State.autoKey = e.target.checked; Toast.show(e.target.checked ? '自動キーON' : '自動キーOFF', e.target.checked ? '値を変更すると自動でキーが作成されます。' : '', '', 1600); };
  $('#btn-addmarker').onclick = () => addMarker(State.time);
  $('#btn-nlmotion').onclick = () => NLMotion.dialog();
  $('#tab-timeline').onclick = () => showGraph(false);
  $('#tab-graph').onclick = () => showGraph(true);
  $('#interpsel').onchange = e => { if (State.selKeys.length) KeyOps.setInterp(e.target.value); };
  $('#btn-kfcopy').onclick = () => KeyOps.copy();
  $('#btn-kfpaste').onclick = () => KeyOps.paste();
  $('#btn-kfdup').onclick = () => KeyOps.duplicate();
  $('#btn-kfdel').onclick = () => KeyOps.deleteSelected();
  $('#btn-kflock').onclick = () => KeyOps.toggleLock();
  $('#btn-kfmute').onclick = () => KeyOps.toggleMute();
  $('#dur-input').onchange = e => { scene().duration = Math.max(.5, +e.target.value); commit('尺の変更'); UI.refreshAll(); };
  $('#fps-input').onchange = e => { P().settings.fps = clamp(+e.target.value, 1, 120); commit('FPSの変更'); UI.refreshAll(); };
  // スプリッター
  makeSplitter($('#split-left'), '#leftcol', 'x', 180, 520);
  makeSplitter($('#split-right'), '#rightcol', 'x', 200, 560, true);
  makeSplitter($('#split-tlnames'), '#tlnames', 'x', 140, 520);
  makeSplitter($('#split-tl'), '#tlarea', 'y', 120, 700, true);
  window.addEventListener('beforeunload', e => { if (State.dirty) { e.preventDefault(); e.returnValue = ''; } });
  try { const sc = localStorage.getItem('k2d_shortcuts'); if (sc) { SHORTCUTS = JSON.parse(sc); buildMenus(); } } catch (e) { }
}

async function boot() {
  Canvas.init(); Timeline.init(); GraphEditor.init();
  bindUI();
  createProject('新規プロジェクト', 1920, 1080, 24, 10);
  AutoSave.start();
  try {
    const auto = await DB.get('autosave');
    if (auto && Date.now() - auto.at < 1000 * 60 * 60 * 24 * 14) {
      UI.confirm('前回の作業データが見つかりました', '「' + auto.name + '」（' + new Date(auto.at).toLocaleString('ja-JP') + '）を復元しますか？',
        async () => { try { await loadProjectData(deepClone(auto.data)); Toast.ok('前回の作業を復元しました'); } catch (e) { Toast.err('復元に失敗しました', e.message); } },
        () => { });
    }
  } catch (e) { /* IndexedDB が使えない環境でも動作を続ける */ }
  Toast.show('柿込2Dへようこそ', 'メニューの ヘルプ →「使い方」に基本操作をまとめています。', '', 6000);
}
document.addEventListener('DOMContentLoaded', () => { try { boot(); } catch (e) { reportError(e, '起動'); } });

</script>
