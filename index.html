<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kakikomi 2D — 2Dアニメーション制作</title>
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --panel3:#2a313b;
  --line:#2e353f; --line2:#3a434f;
  --text:#d9dee5; --dim:#8b94a1; --dim2:#69727e;
  --accent:#f0a23c; --accent-d:#b9761f;
  --sel:#4fc3d9; --play:#ff4d5a; --ok:#6fcf7f; --warn:#e9c46a; --err:#ef6461;
  --bone:#c58bf0;
  --row:26px; --hdr:30px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:12px;-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:12px;color:var(--text)}
button{background:var(--panel3);border:1px solid var(--line2);border-radius:3px;padding:3px 8px;cursor:pointer}
button:hover{background:#333c48}
button:active{background:#3d4855}
button.on{background:var(--accent-d);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
input[type=text],input[type=number],select,textarea{background:#12151a;border:1px solid var(--line2);border-radius:3px;padding:2px 5px;width:100%}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{padding:0;height:20px;border:1px solid var(--line2);background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#12151a}
::-webkit-scrollbar-thumb{background:#39424e;border-radius:5px;border:2px solid #12151a}
::-webkit-scrollbar-thumb:hover{background:#4a5563}

#app{display:flex;flex-direction:column;height:100%}
/* ---------- menubar ---------- */
#menubar{height:30px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px}
#brand{font-weight:700;letter-spacing:.04em;color:var(--accent);padding:0 10px 0 2px;font-size:13px}
#brand small{color:var(--dim2);font-weight:400;letter-spacing:0}
.menu{position:relative}
.menu>.mbtn{padding:4px 9px;border-radius:3px;cursor:pointer}
.menu>.mbtn:hover,.menu.open>.mbtn{background:var(--panel3)}
.mdrop{display:none;position:absolute;top:100%;left:0;min-width:230px;background:var(--panel2);border:1px solid var(--line2);
  border-radius:4px;box-shadow:0 8px 24px #0009;padding:4px;z-index:500}
.menu.open .mdrop{display:block}
.mitem{padding:5px 10px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;gap:20px;white-space:nowrap}
.mitem:hover{background:var(--accent-d);color:#fff}
.mitem .k{color:var(--dim);font-size:11px}
.mitem:hover .k{color:#ffe6c4}
.msep{height:1px;background:var(--line2);margin:4px 2px}
.mlabel{padding:4px 10px;color:var(--dim2);font-size:11px}
#topright{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim)}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0}
#leftcol{width:270px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:180px}
#centercol{flex:1;display:flex;flex-direction:column;min-width:0;background:#0f1216}
#rightcol{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:200px}
.vsplit{width:5px;flex:none;cursor:col-resize;background:transparent}
.vsplit:hover{background:var(--sel)}
.hsplit{height:5px;flex:none;cursor:row-resize;background:transparent}
.hsplit:hover{background:var(--sel)}

.panel-h{height:var(--hdr);flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-weight:600;color:#c3cad3}
.panel-h .sp{margin-left:auto;display:flex;gap:3px}
.iconbtn{width:22px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:12px;line-height:1}
.tabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line);flex:none}
.tab{padding:6px 11px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
.tabbody{display:none;flex:1;min-height:0;flex-direction:column}
.tabbody.on{display:flex}

/* toolbar */
#toolstrip{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:4px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tool{height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--panel3);border:1px solid transparent;border-radius:3px;cursor:pointer}
.tool:hover{background:#39424e}
.tool.on{background:var(--accent-d);border-color:var(--accent);color:#fff}

/* layers */
#layerlist,#assetlist,#scenelist{flex:1;overflow:auto;min-height:0}
.lrow{display:flex;align-items:center;gap:3px;height:24px;padding:0 4px;border-bottom:1px solid #222830;cursor:pointer;white-space:nowrap}
.lrow:hover{background:#242b34}
.lrow.sel{background:#2d4a55}
.lrow .tw{width:12px;text-align:center;color:var(--dim);font-size:9px;cursor:pointer;flex:none}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.lrow .ic{width:14px;text-align:center;flex:none;font-size:11px}
.lrow .tg{width:16px;text-align:center;color:var(--dim2);flex:none;cursor:pointer;font-size:11px}
.lrow .tg.act{color:var(--accent)}
.lrow input.ren{height:18px;padding:0 3px}

/* assets */
#assettools{display:flex;gap:4px;padding:4px;background:var(--panel2);border-bottom:1px solid var(--line);flex:none;align-items:center}
#assetgrid{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;align-content:start;min-height:0}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px;cursor:pointer;text-align:center}
.acard:hover{border-color:var(--sel)}
.acard.sel{border-color:var(--accent);background:#2f2a20}
.acard .th{width:100%;height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:repeating-conic-gradient(#2a2f36 0% 25%,#232830 0% 50%) 50%/12px 12px;border-radius:2px}
.acard .th img{max-width:100%;max-height:100%;image-rendering:auto}
.acard .nm{font-size:10px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderrow{display:flex;align-items:center;gap:4px;padding:3px 6px;cursor:pointer;border-radius:3px}
.folderrow:hover{background:#242b34}
.folderrow.on{background:#2d4a55}
#folderbar{display:flex;gap:4px;padding:4px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);flex:none;max-height:90px;overflow:auto}

/* canvas area */
#canvastop{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow:hidden}
#canvaswrap{flex:1;position:relative;overflow:hidden;background:#0c0e11}
#viewport{position:absolute;inset:0}
#overlay{position:absolute;inset:0;pointer-events:none}
#canvasfoot{height:26px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim)}

/* inspector */
.sec{border-bottom:1px solid var(--line)}
.sech{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--panel2);cursor:pointer;font-weight:600;color:#c3cad3}
.sech .ar{color:var(--dim);font-size:9px;width:10px}
.secb{padding:6px 8px;display:none}
.sec.open .secb{display:block}
.prow{display:flex;align-items:center;gap:5px;margin-bottom:4px;min-height:22px}
.prow>label{width:74px;flex:none;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .f{flex:1;display:flex;gap:4px;min-width:0}
.kbtn{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--panel3);
  padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.kbtn i{width:7px;height:7px;background:var(--dim2);transform:rotate(45deg);display:block;border-radius:1px}
.kbtn.has i{background:var(--accent)}
.kbtn.onkey{border-color:var(--accent)}
.kbtn.onkey i{background:#fff}
.num{cursor:ew-resize}
.hint{color:var(--dim2);font-size:11px;line-height:1.5;padding:4px 0}

/* timeline */
#tlarea{flex:none;height:280px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:120px}
#tltabs{display:flex;align-items:center;gap:2px;background:var(--panel2);border-bottom:1px solid var(--line);flex:none;padding:0 4px;height:28px}
#tlbody{flex:1;display:flex;min-height:0;position:relative}
#tlnames{width:250px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:140px}
#tlnameshdr{height:26px;flex:none;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6px;color:var(--dim);gap:6px}
#tlnamesscroll{flex:1;overflow:hidden;position:relative}
#tlnamesinner{position:absolute;left:0;top:0;right:0}
.trow{height:var(--row);display:flex;align-items:center;gap:3px;padding:0 4px;border-bottom:1px solid #20262e;white-space:nowrap;cursor:pointer;font-size:11px}
.trow:hover{background:#242b34}
.trow.sel{background:#2d4a55}
.trow.prop{color:var(--dim);font-size:11px}
.trow .tw{width:11px;text-align:center;color:var(--dim);font-size:9px;flex:none}
.trow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
#tlcanvaswrap{flex:1;position:relative;overflow:hidden}
#tlcanvas{position:absolute;inset:0}
#graphwrap{flex:1;position:relative;display:none}
#graphcanvas{position:absolute;inset:0}
#tlfoot{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel2);border-top:1px solid var(--line)}
.tlsep{width:1px;height:18px;background:var(--line2);margin:0 3px}
.tc{color:var(--dim);font-variant-numeric:tabular-nums}
#tcbig{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}

/* dialogs */
#modalbg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:1000}
#modalbg.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 20px 60px #000c;min-width:340px;max-width:min(760px,92vw);max-height:88vh;display:flex;flex-direction:column}
.dlg h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;background:var(--panel2);border-radius:6px 6px 0 0}
.dlgb{padding:12px 14px;overflow:auto}
.dlgf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tmplgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tmpl{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;cursor:pointer;background:var(--panel2)}
.tmpl:hover{border-color:var(--sel)}
.tmpl.on{border-color:var(--accent);background:#2f2a20}
.tmpl b{display:block;margin-bottom:2px}
.tmpl span{color:var(--dim);font-size:11px}

/* toast */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2000;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--sel);border-radius:4px;padding:8px 12px;
  max-width:360px;box-shadow:0 6px 20px #0008;animation:tin .18s ease-out}
.toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:var(--warn)} .toast.ok{border-left-color:var(--ok)}
.toast b{display:block;margin-bottom:2px}
.toast p{margin:0;color:var(--dim);font-size:11px;line-height:1.5}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#dropzone{position:fixed;inset:0;background:#0b0e12d9;border:3px dashed var(--accent);z-index:1500;display:none;
  align-items:center;justify-content:center;font-size:18px;color:var(--accent);pointer-events:none}
#dropzone.on{display:flex}
#ctxmenu{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:4px;z-index:1200;box-shadow:0 8px 24px #0009;min-width:170px}
#ctxmenu.on{display:block}
.chk{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--dim)}
.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#nlbox{width:100%;height:60px;resize:vertical}
.badge{background:var(--panel3);border-radius:3px;padding:1px 5px;color:var(--dim);font-size:10px}
#progwrap{height:4px;background:#12151a;border-radius:2px;overflow:hidden;margin-top:8px}
#progbar{height:100%;width:0;background:var(--accent);transition:width .1s}
.small{font-size:11px;color:var(--dim)}
.fxrow{border:1px solid var(--line);border-radius:4px;padding:5px;margin-bottom:5px;background:var(--panel2)}
.fxrow>.h{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.fxrow>.h b{flex:1}
</style>
</head>
<body>
<div id="app">
  <div id="menubar">
    <div id="brand">柿込2D <small>Animation Studio</small></div>
    <div class="menu" data-menu="file"><div class="mbtn">ファイル</div><div class="mdrop" id="m-file"></div></div>
    <div class="menu" data-menu="edit"><div class="mbtn">編集</div><div class="mdrop" id="m-edit"></div></div>
    <div class="menu" data-menu="obj"><div class="mbtn">オブジェクト</div><div class="mdrop" id="m-obj"></div></div>
    <div class="menu" data-menu="anim"><div class="mbtn">アニメーション</div><div class="mdrop" id="m-anim"></div></div>
    <div class="menu" data-menu="view"><div class="mbtn">表示</div><div class="mdrop" id="m-view"></div></div>
    <div class="menu" data-menu="help"><div class="mbtn">ヘルプ</div><div class="mdrop" id="m-help"></div></div>
    <div id="topright">
      <span id="savestate" class="badge">未保存</span>
      <span id="projname" class="badge"></span>
    </div>
  </div>

  <div id="main">
    <div id="leftcol">
      <div id="toolstrip"></div>
      <div class="tabs">
        <div class="tab on" data-tab="layers">レイヤー</div>
        <div class="tab" data-tab="assets">アセット</div>
        <div class="tab" data-tab="scenes">シーン</div>
      </div>
      <div class="tabbody on" id="tb-layers">
        <div class="panel-h">レイヤー
          <div class="sp">
            <button class="iconbtn" id="btn-addgroup" title="グループを追加">▣</button>
            <button class="iconbtn" id="btn-adddraw" title="描画レイヤーを追加">✎</button>
            <button class="iconbtn" id="btn-addbone" title="ボーンを追加">⑂</button>
            <button class="iconbtn" id="btn-dupobj" title="複製">⧉</button>
            <button class="iconbtn" id="btn-delobj" title="削除">🗑</button>
          </div>
        </div>
        <div id="layerlist"></div>
      </div>
      <div class="tabbody" id="tb-assets">
        <div id="assettools">
          <button id="btn-import">読み込み</button>
          <button id="btn-newfolder" title="フォルダを作成">＋フォルダ</button>
          <input type="text" id="assetsearch" placeholder="検索" style="flex:1;min-width:40px">
        </div>
        <div id="folderbar"></div>
        <div id="assetgrid"></div>
      </div>
      <div class="tabbody" id="tb-scenes">
        <div class="panel-h">シーン<div class="sp">
          <button class="iconbtn" id="btn-addscene" title="シーンを追加">＋</button>
          <button class="iconbtn" id="btn-dupscene" title="シーンを複製">⧉</button>
          <button class="iconbtn" id="btn-delscene" title="シーンを削除">🗑</button></div></div>
        <div id="scenelist"></div>
        <div class="panel-h">モーションプリセット<div class="sp">
          <button class="iconbtn" id="btn-savepreset" title="選択オブジェクトの動きを保存">＋</button></div></div>
        <div id="presetlist" style="max-height:220px;overflow:auto"></div>
      </div>
    </div>
    <div class="vsplit" id="split-left"></div>

    <div id="centercol">
      <div id="canvastop">
        <button id="btn-zoomout" class="iconbtn">－</button>
        <span id="zoomlabel" class="tc" style="width:52px;text-align:center">100%</span>
        <button id="btn-zoomin" class="iconbtn">＋</button>
        <button id="btn-zoomfit">全体表示</button>
        <div class="tlsep"></div>
        <button id="btn-grid" title="グリッド">格子</button>
        <button id="btn-snap" title="スナップ">スナップ</button>
        <button id="btn-ruler" title="ルーラー">定規</button>
        <button id="btn-safe" title="セーフエリア">セーフ</button>
        <button id="btn-onion" title="オニオンスキン">オニオン</button>
        <button id="btn-path" title="モーションパス">軌跡</button>
        <div class="tlsep"></div>
        <span class="small" id="toolhint"></span>
      </div>
      <div id="canvaswrap">
        <canvas id="viewport"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div id="canvasfoot">
        <span id="coordlabel">X 0  Y 0</span>
        <span id="sizelabel"></span>
        <span id="sellabel"></span>
        <span id="perflabel" style="margin-left:auto"></span>
      </div>
      <div class="hsplit" id="split-tl"></div>
      <div id="tlarea">
        <div id="tltabs">
          <button id="tab-timeline" class="on">タイムライン</button>
          <button id="tab-graph">グラフエディター</button>
          <div class="tlsep"></div>
          <button id="btn-first" title="先頭 (Home)">⏮</button>
          <button id="btn-prevf" title="1フレーム戻し (←)">◀|</button>
          <button id="btn-play" title="再生/停止 (Space)" style="min-width:34px">▶</button>
          <button id="btn-nextf" title="1フレーム送り (→)">|▶</button>
          <button id="btn-last" title="末尾 (End)">⏭</button>
          <button id="btn-loop" class="on" title="ループ">🔁</button>
          <select id="playspeed" style="width:62px"><option value="0.25">×0.25</option><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="1.5">×1.5</option><option value="2">×2</option></select>
          <div class="tlsep"></div>
          <span id="tcbig">00:00:00</span>
          <span class="tc" id="tcframe"></span>
          <div class="tlsep"></div>
          <button id="btn-addmarker" title="マーカーを追加">🔖</button>
          <button id="btn-nlmotion" title="文章からモーションを作る">文章で動かす</button>
          <span style="margin-left:auto"></span>
          <label class="chk"><input type="checkbox" id="chk-autokey"> 自動キー</label>
        </div>
        <div id="tlbody">
          <div id="tlnames">
            <div id="tlnameshdr"><span>名前</span><span class="small" id="kfcount" style="margin-left:auto"></span></div>
            <div id="tlnamesscroll"><div id="tlnamesinner"></div></div>
          </div>
          <div class="vsplit" id="split-tlnames" style="background:var(--line)"></div>
          <div id="tlcanvaswrap"><canvas id="tlcanvas"></canvas></div>
          <div id="graphwrap"><canvas id="graphcanvas"></canvas></div>
        </div>
        <div id="tlfoot">
          <span class="small">補間</span>
          <select id="interpsel" style="width:110px">
            <option value="linear">リニア</option><option value="step">ステップ</option>
            <option value="easeIn">イーズイン</option><option value="easeOut">イーズアウト</option>
            <option value="easeInOut">イーズインアウト</option><option value="cubic">キュービック</option>
            <option value="bezier">ベジェ</option>
          </select>
          <button id="btn-kfcopy">コピー</button>
          <button id="btn-kfpaste">貼り付け</button>
          <button id="btn-kfdup">複製</button>
          <button id="btn-kfdel">削除</button>
          <button id="btn-kflock">ロック</button>
          <button id="btn-kfmute">無効化</button>
          <div class="tlsep"></div>
          <span class="small">尺</span><input type="number" id="dur-input" style="width:56px" min="1" step="0.5"><span class="small">秒</span>
          <span class="small">FPS</span><input type="number" id="fps-input" style="width:48px" min="1" max="120">
          <div class="tlsep"></div>
          <span class="small" id="kfsellabel"></span>
        </div>
      </div>
    </div>
    <div class="vsplit" id="split-right"></div>
    <div id="rightcol"></div>
  </div>
</div>

<script>
/* ============================================================
   柿込2D Animation Studio — コア
   ============================================================ */
'use strict';
const APP = { version: '1.0.0' };

/* ---------- 汎用ユーティリティ ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const uid = (p) => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const round = (v, n) => { const p = Math.pow(10, n === undefined ? 3 : n); return Math.round(v * p) / p; };
const fmtTime = (t) => {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t % 1) * 100);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':' + String(cs).padStart(2, '0');
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function bytes(n) { return n > 1e6 ? (n / 1048576).toFixed(1) + 'MB' : (n / 1024).toFixed(0) + 'KB'; }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------- エラーガード：アプリを止めない ---------- */
function guard(fn, label) {
  return function () {
    try { return fn.apply(this, arguments); }
    catch (e) { reportError(e, label || fn.name); }
  };
}
const _errCounts = {};
function reportError(e, label) {
  console.error('[' + (label || 'error') + ']', e);
  const key = label + ':' + (e && e.message);
  _errCounts[key] = (_errCounts[key] || 0) + 1;
  if (_errCounts[key] > 3) return; // 同じエラーの連投は抑制
  Toast.show('処理を中断しました', (label ? '[' + label + '] ' : '') + (e && e.message ? e.message : e) +
    '\n編集内容は保持されています。操作をやり直すか、別の方法をお試しください。', 'err', 7000);
}
window.addEventListener('error', ev => { reportError(ev.error || ev.message, 'system'); });
window.addEventListener('unhandledrejection', ev => { reportError(ev.reason, 'async'); });

/* ---------- トースト ---------- */
const Toast = {
  show(title, msg, kind, ms) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = '<b>' + esc(title) + '</b>' + (msg ? '<p>' + esc(msg).replace(/\n/g, '<br>') + '</p>' : '');
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, ms || 3200);
  },
  ok(t, m) { this.show(t, m, 'ok', 2200); },
  warn(t, m) { this.show(t, m, 'warn', 4000); },
  err(t, m) { this.show(t, m, 'err', 6000); }
};

/* ---------- イベント ---------- */
const Bus = {
  m: {},
  on(k, f) { (this.m[k] = this.m[k] || []).push(f); },
  emit(k, a) { (this.m[k] || []).forEach(f => { try { f(a); } catch (e) { reportError(e, 'event:' + k); } }); }
};

/* ============================================================
   データモデル
   ============================================================ */
const PROP_DEFS = {
  x: { label: 'X', def: 0, step: 1, unit: 'px' },
  y: { label: 'Y', def: 0, step: 1, unit: 'px' },
  rot: { label: '回転', def: 0, step: 1, unit: '°' },
  sx: { label: 'スケールX', def: 1, step: .01, unit: '' },
  sy: { label: 'スケールY', def: 1, step: .01, unit: '' },
  skx: { label: 'スキューX', def: 0, step: 1, unit: '°' },
  sky: { label: 'スキューY', def: 0, step: 1, unit: '°' },
  ax: { label: 'アンカーX', def: .5, step: .01, unit: '' },
  ay: { label: 'アンカーY', def: .5, step: .01, unit: '' },
  opacity: { label: '不透明度', def: 1, step: .01, unit: '', min: 0, max: 1 },
  visible: { label: '表示', def: 1, step: 1, type: 'bool' },
  color: { label: '色', def: '#ffffff', type: 'color' },
  colorAmt: { label: '色の強さ', def: 0, step: .01, min: 0, max: 1 },
  len: { label: '長さ', def: 100, step: 1, unit: 'px' },
  // カメラ
  camx: { label: 'カメラX', def: 0, step: 1 }, camy: { label: 'カメラY', def: 0, step: 1 },
  zoom: { label: 'ズーム', def: 1, step: .01 }, camrot: { label: 'カメラ回転', def: 0, step: 1, unit: '°' },
  shake: { label: '揺れ', def: 0, step: .5 },
  // 音声
  volume: { label: '音量', def: 1, step: .01, min: 0, max: 2 }
};
const TRANSFORM_PROPS = ['x', 'y', 'rot', 'sx', 'sy', 'skx', 'sky', 'ax', 'ay', 'opacity', 'colorAmt', 'visible'];

function defaultProps(type) {
  const p = {};
  TRANSFORM_PROPS.forEach(k => p[k] = PROP_DEFS[k].def);
  p.color = '#ffffff';
  if (type === 'bone') { p.len = 100; delete p.ax; delete p.ay; }
  return p;
}

function newObject(type, name, opt) {
  const o = Object.assign({
    id: uid('ob'), type: type, name: name || type, parentId: null,
    assetId: null, visible: true, locked: false, expanded: false, blend: 'source-over',
    props: defaultProps(type), tracks: {}, effects: [],
    frames: [],            // sequence/draw 用: {f:int, assetId} / {f:int, key:string}
    frameHold: true,       // 次のフレームまで保持
    ik: null,              // {targetId, chain:2}
    solo: false, tag: ''
  }, opt || {});
  return o;
}

function newScene(name) {
  return {
    id: uid('sc'), name: name || 'シーン',
    duration: 10, objects: [], markers: [], audio: [],
    camera: { props: { camx: 0, camy: 0, zoom: 1, camrot: 0, shake: 0 }, tracks: {}, id: 'camera' },
    bg: '#1a1a1e', bgTransparent: false
  };
}

function newProject(name, w, h, fps, dur) {
  const p = {
    id: uid('pj'), name: name || '新規プロジェクト', version: APP.version,
    settings: { width: w || 1920, height: h || 1080, fps: fps || 24, bgColor: '#15161a' },
    folders: [{ id: 'root', name: 'アセット', parent: null }],
    assets: {},           // id -> {id,type:'image'|'audio',name,folder,w,h,size,src}
    scenes: [], activeScene: null, presets: [], createdAt: Date.now()
  };
  const s = newScene('シーン 01'); s.duration = dur || 10;
  p.scenes.push(s); p.activeScene = s.id;
  return p;
}

/* ============================================================
   アセットストア（画像・音声の実体を保持）
   ============================================================ */
const Assets = {
  img: {},       // assetId -> HTMLImageElement / ImageBitmap
  buf: {},       // assetId -> AudioBuffer
  wave: {},      // assetId -> Float32Array (波形ピーク)
  thumb: {},     // assetId -> dataURL (サムネイルキャッシュ)
  pending: {},

  getImage(id) { return this.img[id] || null; },

  async loadImageAsset(asset) {
    if (this.img[asset.id]) return this.img[asset.id];
    if (this.pending[asset.id]) return this.pending[asset.id];
    const pr = new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => { this.img[asset.id] = im; asset.w = im.naturalWidth; asset.h = im.naturalHeight; delete this.pending[asset.id]; res(im); };
      im.onerror = () => { delete this.pending[asset.id]; rej(new Error('画像を読み込めません: ' + asset.name)); };
      im.src = asset.src;
    });
    this.pending[asset.id] = pr;
    return pr;
  },

  makeThumb(asset) {
    if (this.thumb[asset.id]) return this.thumb[asset.id];
    const im = this.img[asset.id]; if (!im) return null;
    try {
      const max = 96, s = Math.min(max / im.naturalWidth, max / im.naturalHeight, 1);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/png'); this.thumb[asset.id] = d; return d;
    } catch (e) { return null; }
  },

  async decodeAudio(asset) {
    if (this.buf[asset.id]) return this.buf[asset.id];
    const ac = AudioEngine.ctx();
    const res = await fetch(asset.src);
    const ab = await res.arrayBuffer();
    const buf = await ac.decodeAudioData(ab);
    this.buf[asset.id] = buf;
    this.wave[asset.id] = computePeaks(buf);
    return buf;
  }
};

function computePeaks(buf, n) {
  n = n || 2000;
  const ch = buf.getChannelData(0), step = Math.max(1, Math.floor(ch.length / n));
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let mx = 0; const s = i * step, e = Math.min(ch.length, s + step);
    for (let j = s; j < e; j += 2) { const v = Math.abs(ch[j]); if (v > mx) mx = v; }
    out[i] = mx;
  }
  return out;
}

/* ============================================================
   補間エンジン
   ============================================================ */
const Ease = {
  linear: u => u,
  step: u => 0,
  easeIn: u => u * u,
  easeOut: u => 1 - (1 - u) * (1 - u),
  easeInOut: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  cubic: u => u * u * (3 - 2 * u)
};

/* ベジェ: ハンドルは正規化座標 (0..1 時間, 値比率) */
function bezierEase(u, ox, oy, ix, iy) {
  ox = clamp(ox == null ? .42 : ox, 0, 1); ix = clamp(ix == null ? .58 : ix, 0, 1);
  oy = oy == null ? 0 : oy; iy = iy == null ? 1 : iy;
  // x(t) を解いて y を返す
  let t = u;
  for (let i = 0; i < 8; i++) {
    const mt = 1 - t;
    const x = 3 * mt * mt * t * ox + 3 * mt * t * t * ix + t * t * t;
    const d = 3 * mt * mt * ox + 6 * mt * t * (ix - ox) + 3 * t * t * (1 - ix);
    if (Math.abs(x - u) < 1e-5) break;
    if (Math.abs(d) < 1e-7) break;
    t = clamp(t - (x - u) / d, 0, 1);
  }
  const mt = 1 - t;
  return 3 * mt * mt * t * oy + 3 * mt * t * t * iy + t * t * t;
}

function hex2rgb(h) {
  h = (h || '#ffffff').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}

/* キーフレーム: {id,t,v,interp,ox,oy,ix,iy,locked,muted} */
function newKey(t, v, interp) {
  return { id: uid('kf'), t: round(t, 4), v: v, interp: interp || 'linear', ox: .42, oy: 0, ix: .58, iy: 1, locked: false, muted: false };
}

function activeKeys(track) {
  if (!track) return null;
  let ks = track;
  if (track.some(k => k.muted)) ks = track.filter(k => !k.muted);
  return ks.length ? ks : null;
}

function evalTrack(track, t, def) {
  const ks = activeKeys(track);
  if (!ks) return def;
  if (ks.length === 1) return ks[0].v;
  if (t <= ks[0].t) return ks[0].v;
  const last = ks[ks.length - 1];
  if (t >= last.t) return last.v;
  let lo = 0, hi = ks.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ks[m].t <= t) lo = m; else hi = m; }
  const a = ks[lo], b = ks[hi];
  const span = b.t - a.t;
  let u = span <= 0 ? 0 : (t - a.t) / span;
  if (typeof a.v === 'string') { // color
    if (a.interp === 'step') return a.v;
    const A = hex2rgb(a.v), B = hex2rgb(b.v);
    const e = easeVal(a, u);
    return rgb2hex(lerp(A[0], B[0], e), lerp(A[1], B[1], e), lerp(A[2], B[2], e));
  }
  if (a.interp === 'step') return a.v;
  const e = easeVal(a, u);
  return lerp(a.v, b.v, e);
}
function easeVal(a, u) {
  if (a.interp === 'bezier') return bezierEase(u, a.ox, a.oy, a.ix, a.iy);
  const f = Ease[a.interp] || Ease.linear;
  return f(u);
}

/* ============================================================
   プロパティアクセス（静的値 + トラック）
   ============================================================ */
function getProp(holder, key, t) {
  const tr = holder.tracks && holder.tracks[key];
  if (tr && tr.length) return evalTrack(tr, t, holder.props[key]);
  const v = holder.props ? holder.props[key] : undefined;
  return v === undefined ? (PROP_DEFS[key] ? PROP_DEFS[key].def : 0) : v;
}
function hasTrack(holder, key) { const tr = holder.tracks && holder.tracks[key]; return !!(tr && tr.length); }
function keyAt(holder, key, t, tol) {
  const tr = holder.tracks && holder.tracks[key]; if (!tr) return null;
  tol = tol == null ? 1e-4 : tol;
  return tr.find(k => Math.abs(k.t - t) < tol) || null;
}
function setKey(holder, key, t, v, interp) {
  holder.tracks = holder.tracks || {};
  const tr = holder.tracks[key] = holder.tracks[key] || [];
  const ex = tr.find(k => Math.abs(k.t - t) < 1e-4);
  if (ex) { if (ex.locked) return ex; ex.v = v; return ex; }
  const sel = $('#interpsel');
  const k = newKey(t, v, interp || (sel && sel.value) || 'linear');
  tr.push(k); tr.sort((a, b) => a.t - b.t);
  return k;
}
function removeKey(holder, key, t) {
  const tr = holder.tracks && holder.tracks[key]; if (!tr) return;
  const i = tr.findIndex(k => Math.abs(k.t - t) < 1e-4);
  if (i >= 0) { if (tr[i].locked) return; tr.splice(i, 1); }
  if (!tr.length) delete holder.tracks[key];
}
function setPropValue(holder, key, t, v) {
  // 自動キーON、もしくは既にトラックがある場合はキーを打つ
  if (hasTrack(holder, key) || (State.autoKey && holder.tracks)) setKey(holder, key, t, v);
  else holder.props[key] = v;
  if (hasTrack(holder, key)) { /* 静的値も更新して整合 */ holder.props[key] = v; }
}

/* ============================================================
   グローバル状態
   ============================================================ */
const State = {
  project: null,
  selection: [],          // object id 配列
  selKeys: [],            // {holder:'obj'|'cam'|'audio', id, prop, t}
  time: 0,
  playing: false,
  loop: true,
  speed: 1,
  autoKey: false,
  tool: 'select',
  zoom: 1, panX: 0, panY: 0,
  showGrid: false, snap: true, showRuler: false, showSafe: false, showPath: true,
  onion: false, onionPrev: 2, onionNext: 2, onionAlpha: .28,
  gridSize: 50,
  dirty: false,
  clipboardObjects: null, clipboardKeys: null,
  brush: { size: 12, opacity: 1, hardness: .85, color: '#ffffff', preset: 'ペン' },
  tlScroll: 0, tlStart: 0, tlPxPerSec: 100,
  graphProp: null,
  expandedObjs: {},
  ikMode: false
};

/* 描画レイヤーのピクセルデータ保管 */
const FrameStore = {
  map: {},   // key -> canvas
  get(key) { return this.map[key] || null; },
  put(key, cv) { this.map[key] = cv; },
  create(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  toDataURL(key) { const c = this.map[key]; return c ? c.toDataURL('image/png') : null; },
  async fromDataURL(key, url, w, h) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => { const c = this.create(w, h); c.getContext('2d').drawImage(im, 0, 0); this.map[key] = c; res(c); };
      im.onerror = () => { this.map[key] = this.create(w, h); res(this.map[key]); };
      im.src = url;
    });
  }
};

function P() { return State.project; }
function scene() { const p = P(); return p ? p.scenes.find(s => s.id === p.activeScene) || p.scenes[0] : null; }
function fps() { return P() ? P().settings.fps : 24; }
function frameOf(t) { return Math.round(t * fps()); }
function timeOfFrame(f) { return f / fps(); }
function duration() { const s = scene(); return s ? s.duration : 10; }
function objById(id) { const s = scene(); return s ? s.objects.find(o => o.id === id) : null; }
function selected() { return State.selection.map(objById).filter(Boolean); }
function firstSel() { return State.selection.length ? objById(State.selection[0]) : null; }

function childrenOf(id) { const s = scene(); return s.objects.filter(o => o.parentId === id); }
function rootObjects() { const s = scene(); return s.objects.filter(o => !o.parentId || !s.objects.some(p => p.id === o.parentId)); }
function isDescendant(id, ancestorId) {
  let o = objById(id), guardN = 0;
  while (o && o.parentId && guardN++ < 200) { if (o.parentId === ancestorId) return true; o = objById(o.parentId); }
  return false;
}
/* 深さ優先の表示順（先頭 = 最前面） */
function orderedObjects() {
  const out = [], s = scene();
  const walk = (list, depth) => {
    list.forEach(o => { out.push({ o, depth }); walk(childrenOf(o.id), depth + 1); });
  };
  walk(rootObjects(), 0);
  return out;
}

/* ============================================================
   行列
   ============================================================ */
const M = {
  id: () => [1, 0, 0, 1, 0, 0],
  mul(m, n) {
    return [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  },
  translate: (x, y) => [1, 0, 0, 1, x, y],
  rotate(a) { const c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; },
  scale: (x, y) => [x, 0, 0, y, 0, 0],
  skew(x, y) { return [1, Math.tan(y), Math.tan(x), 1, 0, 0]; },
  apply(m, x, y) { return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] }; },
  invert(m) {
    const det = m[0] * m[3] - m[1] * m[2];
    if (!det) return M.id();
    return [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det,
    (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det];
  }
};

function objSize(o) {
  if (o.type === 'image' || o.type === 'sequence') {
    let a = null;
    if (o.type === 'sequence') { const fr = currentFrameEntry(o, State.time); if (fr) a = P().assets[fr.assetId]; }
    if (!a) a = P().assets[o.assetId];
    if (a) return { w: a.w || 100, h: a.h || 100 };
    return { w: 100, h: 100 };
  }
  if (o.type === 'draw') return { w: P().settings.width, h: P().settings.height };
  if (o.type === 'bone') return { w: getProp(o, 'len', State.time), h: 10 };
  if (o.type === 'particle') return { w: 120, h: 120 };
  return { w: 100, h: 100 };
}

function localMatrix(o, t) {
  const x = getProp(o, 'x', t), y = getProp(o, 'y', t), r = rad(getProp(o, 'rot', t));
  const sx = getProp(o, 'sx', t), sy = getProp(o, 'sy', t);
  const kx = rad(getProp(o, 'skx', t)), ky = rad(getProp(o, 'sky', t));
  let m = M.translate(x, y);
  m = M.mul(m, M.rotate(r));
  m = M.mul(m, M.skew(kx, ky));
  m = M.mul(m, M.scale(sx, sy));
  return m;
}

function worldMatrix(o, t, depth) {
  depth = depth || 0;
  if (depth > 64) return M.id();   // 循環参照の保険
  let base = M.id();
  const par = o.parentId ? objById(o.parentId) : null;
  if (par) {
    base = worldMatrix(par, t, depth + 1);
    if (par.type === 'bone') base = M.mul(base, M.translate(getProp(par, 'len', t), 0));
  }
  return M.mul(base, localMatrix(o, t));
}
/* 画像の左上を原点にする行列（アンカー分だけずらす） */
function drawMatrix(o, t) {
  const m = worldMatrix(o, t);
  const s = objSize(o);
  const ax = getProp(o, 'ax', t), ay = getProp(o, 'ay', t);
  return M.mul(m, M.translate(-ax * s.w, -ay * s.h));
}
function worldOrigin(o, t) { const m = worldMatrix(o, t); return { x: m[4], y: m[5] }; }

function effectiveVisible(o, t) {
  if (!o.visible) return false;
  if (getProp(o, 'visible', t) < .5) return false;
  let p = o.parentId ? objById(o.parentId) : null, n = 0;
  while (p && n++ < 100) { if (!p.visible || getProp(p, 'visible', t) < .5) return false; p = p.parentId ? objById(p.parentId) : null; }
  return true;
}
function effectiveOpacity(o, t) {
  let a = getProp(o, 'opacity', t);
  let p = o.parentId ? objById(o.parentId) : null, n = 0;
  while (p && n++ < 100) { a *= getProp(p, 'opacity', t); p = p.parentId ? objById(p.parentId) : null; }
  return clamp(a, 0, 1);
}

/* ============================================================
   フレームアニメーション
   ============================================================ */
function currentFrameEntry(o, t) {
  if (!o.frames || !o.frames.length) return null;
  const f = frameOf(t);
  let cur = null;
  for (const fr of o.frames) { if (fr.f <= f) { if (!cur || fr.f > cur.f) cur = fr; } }
  if (!cur && !o.frameHold) return null;
  if (!cur) cur = o.frames.reduce((a, b) => a.f < b.f ? a : b);
  return cur;
}

/* ============================================================
   エフェクト
   ============================================================ */
const FX_TYPES = {
  blur: { label: 'ぼかし', params: { radius: { label: '強さ', def: 6, step: .5, min: 0, max: 100 } } },
  glow: { label: '発光', params: { radius: { label: '広がり', def: 14, step: .5, min: 0, max: 100 }, strength: { label: '強さ', def: 1, step: .05, min: 0, max: 4 } }, colors: { color: '#ffd27f' } },
  shadow: { label: '影', params: { dx: { label: 'X', def: 8, step: 1 }, dy: { label: 'Y', def: 8, step: 1 }, radius: { label: 'ぼかし', def: 8, step: .5, min: 0 } }, colors: { color: '#000000' } },
  adjust: {
    label: '色調補正', params: {
      brightness: { label: '明るさ', def: 1, step: .01, min: 0, max: 4 }, contrast: { label: 'コントラスト', def: 1, step: .01, min: 0, max: 4 },
      saturate: { label: '彩度', def: 1, step: .01, min: 0, max: 4 }, hue: { label: '色相', def: 0, step: 1, min: -180, max: 180 }
    }
  },
  motionblur: { label: 'モーションブラー', params: { shutter: { label: 'シャッター', def: .5, step: .05, min: 0, max: 2 }, samples: { label: 'サンプル数', def: 6, step: 1, min: 2, max: 24 } } }
};
function fxKey(fx, p) { return 'fx.' + fx.id + '.' + p; }
function newEffect(type) {
  const d = FX_TYPES[type]; const fx = { id: uid('fx'), type: type, enabled: true, color: (d.colors && d.colors.color) || '#ffffff' };
  return fx;
}
function initEffectProps(o, fx) {
  const d = FX_TYPES[fx.type];
  Object.keys(d.params).forEach(p => { const k = fxKey(fx, p); if (o.props[k] === undefined) o.props[k] = d.params[p].def; });
}
function buildFilter(o, t) {
  const parts = [];
  (o.effects || []).forEach(fx => {
    if (!fx.enabled) return;
    const g = p => getProp(o, fxKey(fx, p), t);
    if (fx.type === 'blur') parts.push('blur(' + Math.max(0, g('radius')) + 'px)');
    else if (fx.type === 'glow') { const s = clamp(g('strength'), 0, 4); const r = Math.max(0, g('radius')); const n = Math.max(1, Math.round(s)); for (let i = 0; i < n; i++) parts.push('drop-shadow(0 0 ' + r + 'px ' + fx.color + ')'); }
    else if (fx.type === 'shadow') parts.push('drop-shadow(' + g('dx') + 'px ' + g('dy') + 'px ' + Math.max(0, g('radius')) + 'px ' + fx.color + ')');
    else if (fx.type === 'adjust') {
      parts.push('brightness(' + Math.max(0, g('brightness')) + ')');
      parts.push('contrast(' + Math.max(0, g('contrast')) + ')');
      parts.push('saturate(' + Math.max(0, g('saturate')) + ')');
      parts.push('hue-rotate(' + g('hue') + 'deg)');
    }
  });
  return parts.length ? parts.join(' ') : 'none';
}
function motionBlurFx(o) { return (o.effects || []).find(f => f.enabled && f.type === 'motionblur'); }

/* ============================================================
   パーティクル（決定論的シミュレーション）
   ============================================================ */
function rnd(seed) { let x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
const PARTICLE_PRESETS = {
  explosion: { count: 90, rate: 900, life: 1.1, speed: 420, spread: 360, gravity: 220, size: 22, sizeEnd: 0, color: '#ffb347', color2: '#ff4d2e', additive: true, burst: true },
  smoke: { count: 60, rate: 18, life: 2.6, speed: 60, spread: 40, gravity: -40, size: 34, sizeEnd: 90, color: '#9aa2ad', color2: '#3a3f47', additive: false, burst: false },
  fire: { count: 70, rate: 46, life: 1.0, speed: 130, spread: 34, gravity: -260, size: 26, sizeEnd: 4, color: '#ffe26b', color2: '#ff3d1f', additive: true, burst: false },
  light: { count: 40, rate: 14, life: 2.4, speed: 34, spread: 360, gravity: -10, size: 12, sizeEnd: 2, color: '#fff3c4', color2: '#ffd166', additive: true, burst: false },
  sparkle: { count: 70, rate: 40, life: .9, speed: 180, spread: 360, gravity: 90, size: 8, sizeEnd: 0, color: '#ffffff', color2: '#7fd8ff', additive: true, burst: false }
};
const PARTICLE_PARAMS = ['count', 'rate', 'life', 'speed', 'spread', 'gravity', 'size', 'sizeEnd'];
function initParticle(o, preset) {
  const pr = PARTICLE_PRESETS[preset] || PARTICLE_PRESETS.fire;
  o.particle = { preset: preset, additive: pr.additive, burst: pr.burst, color: pr.color, color2: pr.color2 };
  PARTICLE_PARAMS.forEach(k => o.props['pt.' + k] = pr[k]);
  o.props['pt.startTime'] = 0;
}
function drawParticles(ctx, o, t) {
  const g = k => getProp(o, 'pt.' + k, t);
  const cfg = o.particle || {};
  const count = clamp(Math.round(g('count')), 0, 600), life = Math.max(.05, g('life'));
  const rate = Math.max(.1, g('rate')), speed = g('speed'), spread = g('spread');
  const grav = g('gravity'), size0 = g('size'), size1 = g('sizeEnd');
  const start = getProp(o, 'pt.startTime', t) || 0;
  const et = t - start; if (et < 0) return;
  ctx.save();
  if (cfg.additive) ctx.globalCompositeOperation = 'lighter';
  const c1 = hex2rgb(cfg.color || '#ffffff'), c2 = hex2rgb(cfg.color2 || '#ff8800');
  for (let i = 0; i < count; i++) {
    let birth = cfg.burst ? 0 : i / rate;
    let age = et - birth;
    if (age < 0) continue;
    if (!cfg.burst) { age = age % (life + 1e-6); }
    else if (age > life) continue;
    const u = age / life;
    const a0 = (spread >= 359 ? rnd(i * 3.1) * 360 : (rnd(i * 3.1) - .5) * spread - 90);
    const sp = speed * (.5 + rnd(i * 7.7) * .8);
    const vx = Math.cos(rad(a0)) * sp, vy = Math.sin(rad(a0)) * sp;
    const px = vx * age, py = vy * age + .5 * grav * age * age;
    const sz = Math.max(.5, lerp(size0, size1, u)) * (.6 + rnd(i * 2.3) * .8);
    const al = clamp(1 - u, 0, 1) * (cfg.additive ? .9 : .7);
    const col = rgb2hex(lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u));
    const gr = ctx.createRadialGradient(px, py, 0, px, py, sz);
    gr.addColorStop(0, col); gr.addColorStop(1, col.replace('#', 'rgba(').length ? hexa(col, 0) : col);
    ctx.globalAlpha = al;
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(px, py, sz, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}
function hexa(h, a) { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ============================================================
   レンダラー
   ============================================================ */
const tintCanvas = document.createElement('canvas');
function renderScene(ctx, t, opt) {
  opt = opt || {};
  const p = P(), s = scene();
  const W = p.settings.width, H = p.settings.height;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!opt.transparent) { ctx.fillStyle = s.bgTransparent ? 'rgba(0,0,0,0)' : s.bg; if (!s.bgTransparent) ctx.fillRect(0, 0, W, H); }
  // カメラ
  const cam = s.camera;
  const cx = getProp(cam, 'camx', t), cy = getProp(cam, 'camy', t);
  const zm = Math.max(.01, getProp(cam, 'zoom', t)), crot = rad(getProp(cam, 'camrot', t));
  const shk = getProp(cam, 'shake', t);
  let sox = 0, soy = 0;
  if (shk > 0) { sox = (rnd(Math.floor(t * 60) * 1.7) - .5) * shk * 2; soy = (rnd(Math.floor(t * 60) * 3.3) - .5) * shk * 2; }
  let camM = M.translate(W / 2 + sox, H / 2 + soy);
  camM = M.mul(camM, M.rotate(crot));
  camM = M.mul(camM, M.scale(zm, zm));
  camM = M.mul(camM, M.translate(-cx - W / 2, -cy - H / 2));
  // オニオンスキン
  if (State.onion && !opt.forExport) {
    const step = 1 / fps();
    for (let i = State.onionPrev; i >= 1; i--) drawPass(ctx, camM, t - i * step, { ghost: '#ff5a6e', alpha: State.onionAlpha * (1 - (i - 1) / (State.onionPrev + 1)) });
    for (let i = State.onionNext; i >= 1; i--) drawPass(ctx, camM, t + i * step, { ghost: '#5ad18a', alpha: State.onionAlpha * (1 - (i - 1) / (State.onionNext + 1)) });
  }
  drawPass(ctx, camM, t, {});
  ctx.restore();
  return camM;
}

function drawPass(ctx, camM, t, mode) {
  const s = scene();
  const list = orderedObjects();
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i].o;
    try { drawObject(ctx, o, t, camM, mode); }
    catch (e) { reportError(e, '描画:' + o.name); }
  }
}

function drawObject(ctx, o, t, camM, mode) {
  if (!effectiveVisible(o, t)) return;
  if (o.type === 'group') return;
  if (o.type === 'bone') return; // ボーンはオーバーレイのみ
  const alpha = effectiveOpacity(o, t) * (mode.alpha != null ? mode.alpha : 1);
  if (alpha <= .002) return;

  const mb = motionBlurFx(o);
  if (mb && !mode.ghost) {
    const sh = clamp(getProp(o, fxKey(mb, 'shutter'), t), 0, 2);
    const n = clamp(Math.round(getProp(o, fxKey(mb, 'samples'), t)), 2, 24);
    for (let i = 0; i < n; i++) {
      const tt = t - (sh / fps()) * (i / (n - 1));
      drawObjectOnce(ctx, o, tt, camM, mode, alpha / n * 1.6);
    }
    return;
  }
  drawObjectOnce(ctx, o, t, camM, mode, alpha);
}

function drawObjectOnce(ctx, o, t, camM, mode, alpha) {
  const dm = M.mul(camM, drawMatrix(o, t));
  ctx.save();
  ctx.setTransform(dm[0], dm[1], dm[2], dm[3], dm[4], dm[5]);
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.globalCompositeOperation = o.blend || 'source-over';
  const f = buildFilter(o, t);
  if (f !== 'none') ctx.filter = f;

  if (o.type === 'particle') { drawParticles(ctx, o, t); ctx.restore(); return; }

  let src = null, sw = 0, sh = 0;
  if (o.type === 'image') { const a = P().assets[o.assetId]; if (a) { src = Assets.getImage(a.id); sw = a.w; sh = a.h; } }
  else if (o.type === 'sequence') { const fr = currentFrameEntry(o, t); if (fr) { const a = P().assets[fr.assetId]; if (a) { src = Assets.getImage(a.id); sw = a.w; sh = a.h; } } }
  else if (o.type === 'draw') { const fr = currentFrameEntry(o, t); if (fr) { src = FrameStore.get(fr.key); if (src) { sw = src.width; sh = src.height; } } }

  if (src && sw && sh) {
    const amt = clamp(getProp(o, 'colorAmt', t), 0, 1);
    if (mode.ghost) {
      ctx.drawImage(src, 0, 0, sw, sh);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.globalAlpha = clamp(alpha * .7, 0, 1);
      ctx.fillStyle = mode.ghost; ctx.fillRect(0, 0, sw, sh);
    } else if (amt > 0.001) {
      tintCanvas.width = sw; tintCanvas.height = sh;
      const tc = tintCanvas.getContext('2d');
      tc.clearRect(0, 0, sw, sh);
      tc.globalCompositeOperation = 'source-over'; tc.drawImage(src, 0, 0, sw, sh);
      tc.globalCompositeOperation = 'source-atop';
      tc.globalAlpha = amt; tc.fillStyle = getProp(o, 'color', t); tc.fillRect(0, 0, sw, sh);
      tc.globalAlpha = 1; tc.globalCompositeOperation = 'source-over';
      ctx.drawImage(tintCanvas, 0, 0, sw, sh);
    } else {
      ctx.drawImage(src, 0, 0, sw, sh);
    }
  }
  ctx.restore();
}

/* ============================================================
   シリアライズ / 履歴 / 保存
   ============================================================ */
const SRCMAP = {};   // assetId -> dataURL（履歴では重複保存しない）

function registerAssetSrc(id, src) { SRCMAP[id] = src; }

function serializeProject(withMedia) {
  const p = P();
  const o = JSON.parse(JSON.stringify(p, (k, v) => k === 'src' ? undefined : v));
  // 描画レイヤーのピクセル
  o.scenes.forEach(sc => sc.objects.forEach(ob => {
    if (ob.type === 'draw') ob.frames = (ob.frames || []).map(f => ({ f: f.f, key: f.key }));
  }));
  if (withMedia) {
    Object.keys(o.assets).forEach(id => { o.assets[id].src = SRCMAP[id] || null; });
    o.drawData = {};
    o.scenes.forEach(sc => sc.objects.forEach(ob => {
      if (ob.type === 'draw') (ob.frames || []).forEach(f => { if (!o.drawData[f.key]) o.drawData[f.key] = FrameStore.toDataURL(f.key); });
    }));
  }
  o.app = APP.version;
  return o;
}

async function deserializeProject(data, withMedia) {
  const p = data;
  p.scenes.forEach(sc => {
    sc.objects.forEach(o => {
      o.props = o.props || {}; o.tracks = o.tracks || {}; o.effects = o.effects || []; o.frames = o.frames || [];
      Object.keys(o.tracks).forEach(k => { if (!Array.isArray(o.tracks[k])) delete o.tracks[k]; else o.tracks[k].sort((a, b) => a.t - b.t); });
    });
    sc.camera = sc.camera || { props: { camx: 0, camy: 0, zoom: 1, camrot: 0, shake: 0 }, tracks: {} };
    sc.audio = sc.audio || []; sc.markers = sc.markers || [];
  });
  if (withMedia) {
    Object.keys(p.assets).forEach(id => { if (p.assets[id].src) registerAssetSrc(id, p.assets[id].src); });
    if (p.drawData) {
      const W = p.settings.width, H = p.settings.height;
      for (const key of Object.keys(p.drawData)) {
        if (p.drawData[key]) await FrameStore.fromDataURL(key, p.drawData[key], W, H);
      }
      delete p.drawData;
    }
  }
  Object.keys(p.assets).forEach(id => { p.assets[id].src = SRCMAP[id] || p.assets[id].src; });
  return p;
}

/* ---------- 履歴 ---------- */
const History = {
  stack: [], idx: -1, max: 80, busy: false,
  reset() { this.stack = []; this.idx = -1; this.push('初期状態'); },
  snap() { return JSON.stringify(serializeProject(false)); },
  push(label) {
    if (this.busy) return;
    const s = this.snap();
    if (this.idx >= 0 && this.stack[this.idx] && this.stack[this.idx].s === s) return;
    this.stack = this.stack.slice(0, this.idx + 1);
    this.stack.push({ label: label || '編集', s: s, sel: State.selection.slice(), time: State.time });
    if (this.stack.length > this.max) this.stack.shift();
    this.idx = this.stack.length - 1;
    State.dirty = true; updateSaveState();
  },
  async apply(e) {
    this.busy = true;
    try {
      const data = JSON.parse(e.s);
      State.project = await deserializeProject(data, false);
      State.selection = (e.sel || []).filter(id => objById(id));
      await ensureAssetsLoaded();
      UI.refreshAll();
    } catch (err) { reportError(err, '履歴の復元'); }
    this.busy = false;
  },
  async undo() {
    if (this.idx <= 0) { Toast.show('これ以上戻せません', '', 'warn', 1500); return; }
    this.idx--; await this.apply(this.stack[this.idx]);
    Toast.show('元に戻す', this.stack[this.idx + 1].label, '', 1300);
  },
  async redo() {
    if (this.idx >= this.stack.length - 1) { Toast.show('これ以上やり直せません', '', 'warn', 1500); return; }
    this.idx++; await this.apply(this.stack[this.idx]);
    Toast.show('やり直し', this.stack[this.idx].label, '', 1300);
  },
  list() { return this.stack.map((e, i) => ({ label: e.label, i, cur: i === this.idx })); },
  async goto(i) { if (i < 0 || i >= this.stack.length) return; this.idx = i; await this.apply(this.stack[i]); }
};
function commit(label) { History.push(label); }

async function ensureAssetsLoaded() {
  const p = P(); const jobs = [];
  Object.values(p.assets).forEach(a => {
    a.src = a.src || SRCMAP[a.id];
    if (a.type === 'image' && a.src && !Assets.img[a.id]) jobs.push(Assets.loadImageAsset(a).catch(e => reportError(e, 'アセット読み込み')));
  });
  await Promise.all(jobs);
}

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('kakikomi2d', 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(new Error('ローカル保存領域を開けません'));
    });
  },
  async put(k, v) { const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readonly'); const q = tx.objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async del(k) { const d = await this.open(); return new Promise(res => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; }); }
};

const AutoSave = {
  timer: null, interval: 60000, last: 0, enabled: true,
  start() { clearInterval(this.timer); this.timer = setInterval(() => this.run(), this.interval); },
  async run(force) {
    if (!this.enabled || !P()) return;
    if (!State.dirty && !force) return;
    try {
      const data = serializeProject(true);
      await DB.put('autosave', { at: Date.now(), name: P().name, data: data });
      const backups = (await DB.get('backups')) || [];
      if (Date.now() - this.last > 5 * 60000) {
        backups.unshift({ at: Date.now(), name: P().name, data: data });
        while (backups.length > 5) backups.pop();
        await DB.put('backups', backups);
        this.last = Date.now();
      }
      $('#savestate').textContent = '自動保存 ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      Toast.warn('自動保存に失敗しました', '保存領域が不足している可能性があります。ファイル→プロジェクトを保存 で手元に保存してください。');
      this.enabled = false;
    }
  }
};

function updateSaveState() {
  $('#savestate').textContent = State.dirty ? '未保存の変更' : '保存済み';
  $('#projname').textContent = P() ? P().name : '';
}

/* ---------- ファイル保存 / 読み込み ---------- */
let _dlCap;
async function getDownloads() {
  if (_dlCap !== undefined) return _dlCap;
  try {
    _dlCap = (window.claude && typeof claude.use === 'function') ? await claude.use('downloads') : null;
  } catch (e) { _dlCap = null; }
  return _dlCap;
}
/* claude.ai上ではダウンロード機能経由（確認ダイアログあり）、
   ローカルでHTMLを直接開いた場合は通常のダウンロードにフォールバック */
async function downloadBlob(blob, filename) {
  const dl = await getDownloads();
  if (dl) {
    try {
      await dl.save({ filename: filename, data: blob });
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') { Toast.show('保存をキャンセルしました', '', '', 2000); return false; }
      if (code === 'too_large') { Toast.err('ファイルが大きすぎます', '解像度・フレーム数・範囲を小さくして再度お試しください。'); return false; }
      if (code === 'rejected_extension') { Toast.err('この形式は保存できません', filename); return false; }
      Toast.err('ファイルを保存できませんでした', (e && e.message) || '時間をおいて再度お試しください。');
      return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  return true;
}

async function saveProjectFile() {
  try {
    const data = serializeProject(true);
    const json = JSON.stringify(data);
    const okSave = await downloadBlob(new Blob([json], { type: 'application/json' }), (P().name || 'project') + '.k2d.json');
    if (!okSave) return;
    State.dirty = false; updateSaveState();
    await AutoSave.run(true);
    Toast.ok('プロジェクトを保存しました', bytes(json.length));
  } catch (e) {
    Toast.err('保存に失敗しました', e.message + '\nプロジェクトが大きすぎる可能性があります。未使用アセットを削除してお試しください。');
  }
}

async function loadProjectData(data) {
  Object.keys(Assets.img).forEach(k => delete Assets.img[k]);
  Object.keys(Assets.buf).forEach(k => delete Assets.buf[k]);
  Object.keys(Assets.thumb).forEach(k => delete Assets.thumb[k]);
  State.project = await deserializeProject(data, true);
  State.selection = []; State.selKeys = []; State.time = 0;
  await ensureAssetsLoaded();
  await AudioEngine.reloadAll();
  History.reset(); State.dirty = false;
  UI.refreshAll(); Canvas.zoomFit(); updateSaveState();
}

async function openProjectFile(file) {
  try {
    const txt = await file.text();
    const data = JSON.parse(txt);
    if (!data.scenes || !data.settings) throw new Error('プロジェクトファイルの形式が正しくありません');
    await loadProjectData(data);
    Toast.ok('プロジェクトを読み込みました', data.name || file.name);
  } catch (e) {
    Toast.err('プロジェクトを開けません', e.message + '\n.k2d ファイルを選択してください。ファイルが破損している場合は自動保存（ファイル→復元）から復旧できます。');

/* ============================================================
   キャンバス（ビューポート）
   ============================================================ */
const Canvas = {
  wrap: null, vp: null, ov: null, vctx: null, octx: null,
  off: document.createElement('canvas'), offctx: null,
  needRender: true, dpr: 1, lastFrameTimes: [],
  drag: null, hoverHandle: null, marquee: null,

  init() {
    this.wrap = $('#canvaswrap'); this.vp = $('#viewport'); this.ov = $('#overlay');
    this.vctx = this.vp.getContext('2d'); this.octx = this.ov.getContext('2d');
    this.offctx = this.off.getContext('2d', { willReadFrequently: false });
    new ResizeObserver(() => this.resize()).observe(this.wrap);
    this.resize();
    this.bindEvents();
    const loop = () => { this.tick(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  resize() {
    const r = this.wrap.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    [this.vp, this.ov].forEach(c => { c.width = Math.max(1, r.width * this.dpr); c.height = Math.max(1, r.height * this.dpr); c.style.width = r.width + 'px'; c.style.height = r.height + 'px'; });
    this.needRender = true;
  },
  /* 座標変換 */
  w2s(x, y) { return { x: (x + State.panX) * State.zoom, y: (y + State.panY) * State.zoom }; },
  s2w(x, y) { return { x: x / State.zoom - State.panX, y: y / State.zoom - State.panY }; },
  mouseWorld(e) {
    const r = this.vp.getBoundingClientRect();
    return this.s2w(e.clientX - r.left, e.clientY - r.top);
  },
  zoomFit() {
    const r = this.wrap.getBoundingClientRect(), p = P();
    const z = Math.min((r.width - 60) / p.settings.width, (r.height - 60) / p.settings.height);
    State.zoom = clamp(z, .02, 8);
    State.panX = (r.width / State.zoom - p.settings.width) / 2;
    State.panY = (r.height / State.zoom - p.settings.height) / 2;
    this.needRender = true; this.updateZoomLabel();
  },
  zoomAt(factor, sx, sy) {
    const before = this.s2w(sx, sy);
    State.zoom = clamp(State.zoom * factor, .02, 16);
    const after = this.s2w(sx, sy);
    State.panX += after.x - before.x; State.panY += after.y - before.y;
    this.needRender = true; this.updateZoomLabel();
  },
  updateZoomLabel() { $('#zoomlabel').textContent = Math.round(State.zoom * 100) + '%'; },

  tick() {
    if (Player.playing) this.needRender = true;
    if (!this.needRender) return;
    this.needRender = false;
    const t0 = performance.now();
    try { this.render(); } catch (e) { reportError(e, 'キャンバス描画'); }
    const dt = performance.now() - t0;
    this.lastFrameTimes.push(dt); if (this.lastFrameTimes.length > 30) this.lastFrameTimes.shift();
    const avg = this.lastFrameTimes.reduce((a, b) => a + b, 0) / this.lastFrameTimes.length;
    $('#perflabel').textContent = '描画 ' + avg.toFixed(1) + 'ms';
  },

  render() {
    const p = P(); if (!p) return;
    const W = p.settings.width, H = p.settings.height;
    if (this.off.width !== W || this.off.height !== H) { this.off.width = W; this.off.height = H; }
    renderScene(this.offctx, State.time, {});
    const g = this.vctx;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.clearRect(0, 0, this.vp.width, this.vp.height);
    g.fillStyle = '#0c0e11'; g.fillRect(0, 0, this.vp.width, this.vp.height);
    const o = this.w2s(0, 0);
    // 市松模様（キャンバス領域）
    g.save();
    g.translate(o.x, o.y); g.scale(State.zoom, State.zoom);
    const chk = 16;
    g.fillStyle = '#20242a'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#191d22';
    for (let yy = 0; yy < H; yy += chk) for (let xx = ((yy / chk) % 2) * chk; xx < W; xx += chk * 2) g.fillRect(xx, yy, chk, chk);
    g.imageSmoothingEnabled = State.zoom < 3;
    g.imageSmoothingQuality = 'high';
    g.drawImage(this.off, 0, 0);
    g.restore();
    g.strokeStyle = '#4a545f'; g.lineWidth = 1;
    g.strokeRect(o.x - .5, o.y - .5, W * State.zoom + 1, H * State.zoom + 1);
    this.renderOverlay();
  },

  renderOverlay() {
    const g = this.octx, p = P(), W = p.settings.width, H = p.settings.height;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.clearRect(0, 0, this.ov.width, this.ov.height);
    const t = State.time;
    // グリッド
    if (State.showGrid) {
      g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1; g.beginPath();
      for (let x = 0; x <= W; x += State.gridSize) { const a = this.w2s(x, 0), b = this.w2s(x, H); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
      for (let y = 0; y <= H; y += State.gridSize) { const a = this.w2s(0, y), b = this.w2s(W, y); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.16)'; g.beginPath();
      const c1 = this.w2s(W / 2, 0), c2 = this.w2s(W / 2, H), c3 = this.w2s(0, H / 2), c4 = this.w2s(W, H / 2);
      g.moveTo(c1.x, c1.y); g.lineTo(c2.x, c2.y); g.moveTo(c3.x, c3.y); g.lineTo(c4.x, c4.y); g.stroke();
    }
    // セーフエリア
    if (State.showSafe) {
      g.strokeStyle = 'rgba(240,162,60,.55)'; g.setLineDash([5, 4]);
      [[.05, .05], [.1, .1]].forEach(m => {
        const a = this.w2s(W * m[0], H * m[1]), b = this.w2s(W * (1 - m[0]), H * (1 - m[1]));
        g.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      });
      g.setLineDash([]);
    }
    // ガイド
    const s = scene(); (s.guides || []).forEach(gd => {
      g.strokeStyle = '#4fc3d9'; g.lineWidth = 1; g.beginPath();
      if (gd.axis === 'x') { const a = this.w2s(gd.pos, -3000), b = this.w2s(gd.pos, 6000); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
      else { const a = this.w2s(-3000, gd.pos), b = this.w2s(6000, gd.pos); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
      g.stroke();
    });
    // ボーン
    s.objects.forEach(o => {
      if (o.type !== 'bone' || !effectiveVisible(o, t)) return;
      const m = worldMatrix(o, t), L = getProp(o, 'len', t);
      const a = M.apply(m, 0, 0), b = M.apply(m, L, 0);
      const A = this.w2s(a.x, a.y), B = this.w2s(b.x, b.y);
      const sel = State.selection.includes(o.id);
      g.strokeStyle = sel ? '#ffd27f' : 'rgba(197,139,240,.9)'; g.lineWidth = sel ? 3 : 2;
      g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
      g.fillStyle = sel ? '#ffd27f' : '#c58bf0';
      g.beginPath(); g.arc(A.x, A.y, 5, 0, 6.2832); g.fill();
      g.beginPath(); g.arc(B.x, B.y, 3.5, 0, 6.2832); g.fill();
      if (o.ik) { g.strokeStyle = '#6fcf7f'; g.setLineDash([3, 3]); g.beginPath(); g.arc(B.x, B.y, 9, 0, 6.2832); g.stroke(); g.setLineDash([]); }
    });
    // モーションパス
    if (State.showPath) selected().forEach(o => this.drawMotionPath(g, o));
    // 選択ギズモ
    selected().forEach(o => this.drawGizmo(g, o, t));
    // マーキー選択
    if (this.marquee) {
      const m = this.marquee;
      g.strokeStyle = '#4fc3d9'; g.fillStyle = 'rgba(79,195,217,.12)'; g.lineWidth = 1;
      const x = Math.min(m.x0, m.x1), y = Math.min(m.y0, m.y1), w = Math.abs(m.x1 - m.x0), h = Math.abs(m.y1 - m.y0);
      const a = this.w2s(x, y);
      g.fillRect(a.x, a.y, w * State.zoom, h * State.zoom); g.strokeRect(a.x, a.y, w * State.zoom, h * State.zoom);
    }
    // ブラシプレビュー
    if (this.brushPos && isPaintTool(State.tool)) {

      g.strokeStyle = '#ffffffaa'; g.lineWidth = 1;
      g.beginPath(); g.arc(b.x, b.y, State.brush.size * State.zoom / 2, 0, 6.2832); g.stroke();

      if (State.tool === 'line') { g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
      else if (State.tool === 'ellipse') { g.beginPath(); g.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, 6.2832); g.stroke(); }
      else g.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));

    }
    // ルーラー
    if (State.showRuler) this.drawRuler(g);
    // スナップ表示線
    if (this.snapLines) {
      g.strokeStyle = '#ff9f43'; g.lineWidth = 1; g.setLineDash([4, 3]);
      this.snapLines.forEach(l => {
        g.beginPath();
        if (l.axis === 'x') { const a = this.w2s(l.pos, -5000), b = this.w2s(l.pos, 9000); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
        else { const a = this.w2s(-5000, l.pos), b = this.w2s(9000, l.pos); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); }
        g.stroke();
      });
      g.setLineDash([]);
    }
  },

  drawRuler(g) {
    const r = this.wrap.getBoundingClientRect();
    g.fillStyle = 'rgba(27,31,38,.95)';
    g.fillRect(0, 0, r.width, 18); g.fillRect(0, 0, 18, r.height);
    g.strokeStyle = '#3a434f'; g.beginPath(); g.moveTo(0, 18.5); g.lineTo(r.width, 18.5); g.moveTo(18.5, 0); g.lineTo(18.5, r.height); g.stroke();
    g.fillStyle = '#8b94a1'; g.font = '9px system-ui'; g.strokeStyle = '#59636f';
    let step = 100; const zs = step * State.zoom;
    if (zs < 40) step = 500; if (zs > 200) step = 50;
    const w0 = this.s2w(0, 0), w1 = this.s2w(r.width, r.height);
    g.beginPath();
    for (let x = Math.floor(w0.x / step) * step; x < w1.x; x += step) {
      const p = this.w2s(x, 0); g.moveTo(p.x, 10); g.lineTo(p.x, 18); g.fillText(x, p.x + 2, 9);
    }
    for (let y = Math.floor(w0.y / step) * step; y < w1.y; y += step) {
      const p = this.w2s(0, y); g.moveTo(10, p.y); g.lineTo(18, p.y);
      g.save(); g.translate(8, p.y - 2); g.rotate(-Math.PI / 2); g.fillText(y, 0, 0); g.restore();
    }
    g.stroke();
  },

  drawGizmo(g, o, t) {
    const dm = drawMatrix(o, t), sz = objSize(o);
    const pts = [[0, 0], [sz.w, 0], [sz.w, sz.h], [0, sz.h]].map(p => { const w = M.apply(dm, p[0], p[1]); return this.w2s(w.x, w.y); });
    g.strokeStyle = '#4fc3d9'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < 4; i++) g.lineTo(pts[i].x, pts[i].y); g.closePath(); g.stroke();
    // ハンドル
    const hs = this.handlePositions(o, t);
    g.fillStyle = '#0f1216'; g.strokeStyle = '#4fc3d9';
    hs.forEach(h => { if (h.k === 'rot') return; g.beginPath(); g.rect(h.x - 4, h.y - 4, 8, 8); g.fill(); g.stroke(); });
    const rh = hs.find(h => h.k === 'rot');
    if (rh) {
      const top = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      g.beginPath(); g.moveTo(top.x, top.y); g.lineTo(rh.x, rh.y); g.stroke();
      g.beginPath(); g.arc(rh.x, rh.y, 5, 0, 6.2832); g.fillStyle = '#4fc3d9'; g.fill();
    }
    // アンカー
    const wm = worldMatrix(o, t), a = this.w2s(wm[4], wm[5]);
    g.strokeStyle = '#f0a23c'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(a.x - 8, a.y); g.lineTo(a.x + 8, a.y); g.moveTo(a.x, a.y - 8); g.lineTo(a.x, a.y + 8); g.stroke();
    g.beginPath(); g.arc(a.x, a.y, 4, 0, 6.2832); g.stroke();
  },

  handlePositions(o, t) {
    const dm = drawMatrix(o, t), sz = objSize(o);
    const corner = [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5], ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]];
    const out = corner.map(c => { const w = M.apply(dm, c[1] * sz.w, c[2] * sz.h); const s = this.w2s(w.x, w.y); return { k: c[0], x: s.x, y: s.y }; });
    const n = M.apply(dm, sz.w / 2, -34 / Math.max(.05, State.zoom)); const ns = this.w2s(n.x, n.y);
    out.push({ k: 'rot', x: ns.x, y: ns.y });
    return out;
  },

  drawMotionPath(g, o) {
    const tx = o.tracks.x, ty = o.tracks.y;
    if (!tx && !ty) return;
    const times = new Set(); (tx || []).forEach(k => times.add(k.t)); (ty || []).forEach(k => times.add(k.t));
    const arr = Array.from(times).sort((a, b) => a - b);
    if (arr.length < 2) return;
    const par = o.parentId ? objById(o.parentId) : null;
    const pos = tt => {
      let m = M.id();
      if (par) { m = worldMatrix(par, tt); if (par.type === 'bone') m = M.mul(m, M.translate(getProp(par, 'len', tt), 0)); }
      const lx = getProp(o, 'x', tt), ly = getProp(o, 'y', tt);
      const w = M.apply(m, lx, ly); return this.w2s(w.x, w.y);
    };
    g.strokeStyle = 'rgba(240,162,60,.75)'; g.lineWidth = 1.5; g.setLineDash([]);
    g.beginPath();
    const t0 = arr[0], t1 = arr[arr.length - 1], N = Math.min(240, Math.max(24, Math.round((t1 - t0) * fps())));
    for (let i = 0; i <= N; i++) { const tt = lerp(t0, t1, i / N); const p = pos(tt); if (i === 0) g.moveTo(p.x, p.y); else g.lineTo(p.x, p.y); }
    g.stroke();
    arr.forEach(tt => {
      const p = pos(tt);
      g.fillStyle = Math.abs(tt - State.time) < 1e-4 ? '#fff' : '#f0a23c';
      g.beginPath(); g.rect(p.x - 3.5, p.y - 3.5, 7, 7); g.fill();
    });
  },

  /* ---------- ヒットテスト ---------- */
  hitTest(wx, wy) {
    const t = State.time, list = orderedObjects();
    for (const it of list) {
      const o = it.o;
      if (o.locked || !effectiveVisible(o, t)) continue;
      if (o.type === 'group') continue;
      if (o.type === 'bone') { if (this.hitBone(o, wx, wy, t)) return o; continue; }
      const sz = objSize(o), inv = M.invert(drawMatrix(o, t));
      const p = M.apply(inv, wx, wy);
      if (p.x < 0 || p.y < 0 || p.x > sz.w || p.y > sz.h) continue;
      if (o.type === 'image' || o.type === 'sequence' || o.type === 'draw') {
        if (this.alphaAt(o, p.x, p.y, t) < 8) continue;
      }
      return o;
    }
    return null;
  },
  hitBone(o, wx, wy, t) {
    const m = worldMatrix(o, t), L = getProp(o, 'len', t);
    const a = M.apply(m, 0, 0), b = M.apply(m, L, 0);
    const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy || 1;
    let u = ((wx - a.x) * dx + (wy - a.y) * dy) / len2; u = clamp(u, 0, 1);
    const px = a.x + dx * u, py = a.y + dy * u;
    return Math.hypot(wx - px, wy - py) < 10 / State.zoom;
  },
  _scratch: document.createElement('canvas'),
  alphaAt(o, lx, ly, t) {
    try {
      let src = null, sw, sh;
      if (o.type === 'image') { const a = P().assets[o.assetId]; if (!a) return 0; src = Assets.getImage(a.id); sw = a.w; sh = a.h; }
      else if (o.type === 'sequence') { const fr = currentFrameEntry(o, t); if (!fr) return 0; const a = P().assets[fr.assetId]; if (!a) return 0; src = Assets.getImage(a.id); sw = a.w; sh = a.h; }
      else { const fr = currentFrameEntry(o, t); if (!fr) return 0; src = FrameStore.get(fr.key); if (!src) return 0; sw = src.width; sh = src.height; }
      if (!src) return 0;
      const c = this._scratch; c.width = 1; c.height = 1;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.clearRect(0, 0, 1, 1);
      x.drawImage(src, clamp(Math.floor(lx), 0, sw - 1), clamp(Math.floor(ly), 0, sh - 1), 1, 1, 0, 0, 1, 1);
      return x.getImageData(0, 0, 1, 1).data[3];
    } catch (e) { return 255; }
  },

  /* ---------- スナップ ---------- */
  snapPoint(wx, wy, exclude) {
    if (!State.snap) { this.snapLines = null; return { x: wx, y: wy }; }
    const p = P(), tol = 8 / State.zoom, lines = [];
    const cands = { x: [0, p.settings.width / 2, p.settings.width], y: [0, p.settings.height / 2, p.settings.height] };
    if (State.showGrid) { cands.x.push(Math.round(wx / State.gridSize) * State.gridSize); cands.y.push(Math.round(wy / State.gridSize) * State.gridSize); }
    (scene().guides || []).forEach(g => cands[g.axis].push(g.pos));
    scene().objects.forEach(o => {
      if (exclude && (o.id === exclude || isDescendant(o.id, exclude))) return;
      if (!effectiveVisible(o, State.time)) return;
      const w = worldOrigin(o, State.time); cands.x.push(w.x); cands.y.push(w.y);
    });
    let x = wx, y = wy;
    let bx = tol, by = tol;
    cands.x.forEach(c => { const d = Math.abs(c - wx); if (d < bx) { bx = d; x = c; } });
    cands.y.forEach(c => { const d = Math.abs(c - wy); if (d < by) { by = d; y = c; } });
    this.snapLines = [];
    if (bx < tol) this.snapLines.push({ axis: 'x', pos: x });
    if (by < tol) this.snapLines.push({ axis: 'y', pos: y });
    if (!this.snapLines.length) this.snapLines = null;
    return { x, y };
  },

  /* ---------- 入力 ---------- */
  bindEvents() {
    const vp = this.ov;
    this.ov.style.pointerEvents = 'auto';
    vp.addEventListener('mousedown', guard(e => this.onDown(e), 'canvas:down'));
    window.addEventListener('mousemove', guard(e => this.onMove(e), 'canvas:move'));
    window.addEventListener('mouseup', guard(e => this.onUp(e), 'canvas:up'));
    vp.addEventListener('wheel', guard(e => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey || !e.shiftKey) this.zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
      else { State.panX -= e.deltaX / State.zoom; State.panY -= e.deltaY / State.zoom; this.needRender = true; }
    }, 'canvas:wheel'), { passive: false });
    vp.addEventListener('contextmenu', e => { e.preventDefault(); UI.objectContextMenu(e); });
    vp.addEventListener('dblclick', guard(e => {
      const w = this.mouseWorld(e); const o = this.hitTest(w.x, w.y);
      if (o) { State.selection = [o.id]; UI.refreshLayers(); UI.refreshInspector(); Timeline.draw(); }
    }, 'canvas:dbl'));
    // ドラッグ&ドロップ
    const dz = $('#dropzone');
    ['dragenter', 'dragover'].forEach(k => window.addEventListener(k, e => { e.preventDefault(); if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) dz.classList.add('on'); }));
    ['dragleave', 'drop'].forEach(k => window.addEventListener(k, e => { e.preventDefault(); if (k === 'dragleave' && e.relatedTarget) return; dz.classList.remove('on'); }));
    window.addEventListener('drop', guard(async e => {
      e.preventDefault(); dz.classList.remove('on');
      const files = Array.from(e.dataTransfer.files || []);
      if (!files.length) return;
      const overCanvas = e.target === this.ov || this.wrap.contains(e.target);
      const w = overCanvas ? this.mouseWorld(e) : null;
      await AssetsUI.importFiles(files, w);
    }, 'drop'));
  },

  onDown(e) {
    if (e.button === 1 || (e.button === 0 && (e.altKey || Keys.space))) {
      this.drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, px: State.panX, py: State.panY }; return;
    }
    if (e.button !== 0) return;
    const w = this.mouseWorld(e);
    // ルーラーからガイド
    if (State.showRuler) {
      const r = this.vp.getBoundingClientRect(); const lx = e.clientX - r.left, ly = e.clientY - r.top;

/* ============================================================

const ROWH = 26, RULERH = 24;
const Timeline = {

  init() {

  resize() {

  snapTime(t) { return State.snap ? Math.round(t * fps()) / fps() : t; },

  buildRows() {
    const rows = [];
    const s = scene();
    if (!s) { this.rows = rows; return rows; }
    rows.push({ type: 'cam', name: 'カメラ', holder: s.camera, depth: 0, id: 'camera' });
    if (State.expandedObjs['camera']) {

  refreshNames() {

      const selCls = (r.obj && State.selection.includes(r.obj.id)) || (r.type === 'cam' && State.selection.includes('camera')) ? ' sel' : '';
      const tw = (r.type === 'obj' || r.type === 'cam') ? '<span class="tw" data-tw="' + r.id + '">' + (State.expandedObjs[r.id] ? '▼' : '▶') + '</span>' : '<span class="tw"></span>';

        tw + '<span class="nm">' + ic + esc(r.name) + '</span>' +

  },
  updatePropValues() {

  },

  draw() {

    const x0 = this.t2x(0); if (x0 > 0) g.fillRect(0, 0, x0, H);

    // 目盛り
    const pps = State.tlPxPerSec;
    let step = 1;
    const cand = [1 / fps(), .1, .25, .5, 1, 2, 5, 10, 30, 60];
    for (const c of cand) { if (c * pps >= 60) { step = c; break; } step = 60; }

    for (let i = first; i < lastRow; i++) {

      g.fillRect(0, y, W, ROWH);

      g.strokeStyle = 'rgba(111,207,127,.35)'; g.beginPath(); g.moveTo(x + .5, RULERH); g.lineTo(x + .5, H); g.stroke();

  },

  drawObjectRow(g, r, y) {

    const times = new Set();
    const collect = h => Object.keys(h.tracks || {}).forEach(p => (h.tracks[p] || []).forEach(k => times.add(k.t)));

      const x = this.t2x(t); if (x < -8 || x > this.W + 8) return;

  },
  drawTrack(g, track, y, r) {

  },
  drawFrames(g, r, y) {

function interpLabel(i) {
