/* ---------- キー操作 ---------- */
const KeyOps = {
  each(fn) { State.selKeys.forEach(ref => { const k = Timeline.findKey(ref); const h = Timeline.holderOf(ref); if (k && h) fn(k, h, ref); }); },
  deleteSelected() {
    if (!State.selKeys.length) return;
    this.each((k, h, ref) => { if (k.locked) return; const tr = h.tracks[ref.prop]; const i = tr.indexOf(k); if (i >= 0) tr.splice(i, 1); if (!tr.length) delete h.tracks[ref.prop]; });
    State.selKeys = []; commit('キー削除'); UI.refreshAllTimeline();
  },
  copy() {
    if (!State.selKeys.length) return;
    const items = [];
    this.each((k, h, ref) => items.push({ prop: ref.prop, holderId: ref.holderId, k: deepClone(k) }));
    const t0 = Math.min.apply(null, items.map(i => i.k.t));
    State.clipboardKeys = { t0, items };
    Toast.ok(items.length + ' 個のキーをコピーしました');
  },
  paste(at) {
    const c = State.clipboardKeys; if (!c) { Toast.warn('コピーされたキーがありません'); return; }
    const base = at == null ? State.time : at;
    c.items.forEach(it => {
      const h = it.holderId === 'camera' ? scene().camera : (objById(it.holderId) || firstSel());
      if (!h) return;
      const nk = deepClone(it.k); nk.id = uid('kf'); nk.t = round(base + (it.k.t - c.t0), 4);
      h.tracks = h.tracks || {}; const tr = h.tracks[it.prop] = h.tracks[it.prop] || [];
      const ex = tr.findIndex(k => Math.abs(k.t - nk.t) < 1e-4); if (ex >= 0) tr.splice(ex, 1);
      tr.push(nk); tr.sort((a, b) => a.t - b.t);
    });
    commit('キー貼り付け'); UI.refreshAllTimeline();
  },
  duplicate() { this.copy(); this.paste(State.time); },
  toggleLock() { this.each(k => k.locked = !k.locked); commit('キーのロック'); Timeline.draw(); },
  toggleMute() { this.each(k => k.muted = !k.muted); commit('キーの無効化'); Timeline.draw(); Canvas.needRender = true; },
  setInterp(i) { this.each(k => { if (!k.locked) k.interp = i; }); commit('補間の変更'); Timeline.draw(); GraphEditor.draw(); Canvas.needRender = true; },
  selectAll() {
    const picked = [];
    scene().objects.forEach(o => Object.keys(o.tracks || {}).forEach(p => o.tracks[p].forEach(k => picked.push({ kid: k.id, holderId: o.id, prop: p }))));
    State.selKeys = picked; Timeline.draw();
  }
};

/* ============================================================
   グラフエディター
   ============================================================ */
const GraphEditor = {
  cv: null, ctx: null, wrap: null, dpr: 1, vmin: -100, vmax: 100, drag: null, visible: false,
  init() {
    this.wrap = $('#graphwrap'); this.cv = $('#graphcanvas'); this.ctx = this.cv.getContext('2d');
    new ResizeObserver(() => this.resize()).observe(this.wrap);
    this.bind();
  },
  resize() {
    const r = this.wrap.getBoundingClientRect(); if (!r.width) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = r.width * this.dpr; this.cv.height = r.height * this.dpr;
    this.cv.style.width = r.width + 'px'; this.cv.style.height = r.height + 'px';
    this.W = r.width; this.H = r.height; this.draw();
  },
  tracks() {
    const out = [];
    if (!P() || !scene()) return out;
    const add = (holder, id, prop, color) => { if (holder.tracks && holder.tracks[prop] && holder.tracks[prop].length) out.push({ holder, holderId: id, prop, color }); };
    const colors = ['#f0a23c', '#4fc3d9', '#6fcf7f', '#e06c9f', '#c58bf0', '#ffd166', '#7fd8ff', '#ff8f6b'];
    let i = 0;
    const sel = selected();
    if (State.selection.includes('camera')) { Object.keys(scene().camera.tracks || {}).forEach(p => add(scene().camera, 'camera', p, colors[i++ % 8])); }
    sel.forEach(o => Object.keys(o.tracks || {}).forEach(p => add(o, o.id, p, colors[i++ % 8])));
    if (State.graphProp) {
      const only = out.filter(t => t.prop === State.graphProp.prop && t.holderId === State.graphProp.holderId);
      if (only.length && State.graphSolo) return only;
    }
    return out;
  },
  fit() {
    const ts = this.tracks(); let mn = Infinity, mx = -Infinity;
    ts.forEach(t => t.holder.tracks[t.prop].forEach(k => { if (typeof k.v === 'number') { mn = Math.min(mn, k.v); mx = Math.max(mx, k.v); } }));
    if (!isFinite(mn)) { mn = -1; mx = 1; }
    if (mx - mn < 1e-6) { mn -= 1; mx += 1; }
    const pad = (mx - mn) * .18; this.vmin = mn - pad; this.vmax = mx + pad;
    this.draw();
  },
  v2y(v) { return this.H - 18 - ((v - this.vmin) / (this.vmax - this.vmin)) * (this.H - 36); },
  y2v(y) { return this.vmin + ((this.H - 18 - y) / (this.H - 36)) * (this.vmax - this.vmin); },
  t2x(t) { return Timeline.t2x(t); },
  x2t(x) { return Timeline.x2t(x); },

  draw() {
    if (!this.visible || !this.ctx || !this.W || !P() || !scene()) return;
    const g = this.ctx, W = this.W, H = this.H;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.fillStyle = '#12151a'; g.fillRect(0, 0, W, H);
    // 値グリッド
    g.strokeStyle = '#232932'; g.fillStyle = '#69727e'; g.font = '10px system-ui'; g.textBaseline = 'middle';
    const range = this.vmax - this.vmin;
    let vstep = Math.pow(10, Math.floor(Math.log10(range / 5)));
    if (range / vstep > 10) vstep *= 2; if (range / vstep < 4) vstep /= 2;
    g.beginPath();
    for (let v = Math.ceil(this.vmin / vstep) * vstep; v <= this.vmax; v += vstep) {
      const y = Math.round(this.v2y(v)) + .5; g.moveTo(34, y); g.lineTo(W, y);
      g.fillText(round(v, 3), 3, y);
    }
    g.stroke();
    // 時間グリッド
    g.strokeStyle = '#1e242b'; g.beginPath();
    const step = State.tlPxPerSec > 120 ? .5 : 1;
    for (let t = Math.floor(State.tlStart); t < this.x2t(W); t += step) { const x = Math.round(this.t2x(t)) + .5; g.moveTo(x, 0); g.lineTo(x, H); }
    g.stroke();
    // カーブ
    const ts = this.tracks();
    ts.forEach(tk => {
      const arr = tk.holder.tracks[tk.prop];
      if (!arr.length || typeof arr[0].v === 'string') return;
      g.strokeStyle = tk.color; g.lineWidth = 1.6; g.beginPath();
      const t0 = Math.max(arr[0].t, State.tlStart), t1 = Math.min(arr[arr.length - 1].t, this.x2t(W));
      const N = Math.max(8, Math.min(1200, Math.round((t1 - t0) * State.tlPxPerSec / 2)));
      for (let i = 0; i <= N; i++) {

          const hx = x + dx * k.ox, hy = y + dy * k.oy;
          const ix = x + dx * k.ix, iy = y + dy * k.iy;
          g.strokeStyle = '#8b94a1'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(x, y); g.lineTo(hx, hy); g.moveTo(this.t2x(nk.t), this.v2y(nk.v)); g.lineTo(ix, iy); g.stroke();
          g.fillStyle = '#8b94a1';
          g.beginPath(); g.arc(hx, hy, 3.5, 0, 6.2832); g.fill();
          g.beginPath(); g.arc(ix, iy, 3.5, 0, 6.2832); g.fill();
        }
        g.fillStyle = sel ? '#fff' : tk.color;
        g.beginPath(); g.rect(x - 4, y - 4, 8, 8); g.fill();
        g.strokeStyle = '#0f1216'; g.lineWidth = 1; g.stroke();
      });
    });
    // 凡例
    let ly = 6;
    ts.slice(0, 10).forEach(tk => {
      g.fillStyle = tk.color; g.fillRect(W - 116, ly + 3, 8, 8);
      g.fillStyle = '#8b94a1'; g.textBaseline = 'top';
      g.fillText(propLabel(tk.holder, tk.prop), W - 104, ly + 2);
      ly += 13;
    });
    g.textBaseline = 'middle';
    // 再生ヘッド
    const px = this.t2x(State.time);
    g.strokeStyle = '#ff4d5a'; g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke();
  },

  hit(x, y) {
    const ts = this.tracks();
    for (const tk of ts) {
      const arr = tk.holder.tracks[tk.prop];
      for (let i = 0; i < arr.length; i++) {
        const k = arr[i];
        if (typeof k.v === 'string') continue;
        const kx = this.t2x(k.t), ky = this.v2y(k.v);
        if (Math.abs(kx - x) < 6 && Math.abs(ky - y) < 6) return { tk, k, i, kind: 'key' };
        if (k.interp === 'bezier' && i < arr.length - 1) {
          const nk = arr[i + 1], dx = this.t2x(nk.t) - kx, dy = this.v2y(nk.v) - ky;
          if (Math.hypot(kx + dx * k.ox - x, ky + dy * k.oy - y) < 6) return { tk, k, i, kind: 'out', dx, dy };
          if (Math.hypot(kx + dx * k.ix - x, ky + dy * k.iy - y) < 6) return { tk, k, i, kind: 'in', dx, dy };
        }
      }
    }
    return null;
  },
  bind() {
    const cv = this.cv;
    cv.addEventListener('mousedown', guard(e => {
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (e.button === 1) { this.drag = { kind: 'pan', x, t0: State.tlStart, y, v0: this.vmin, v1: this.vmax }; return; }
      const h = this.hit(x, y);
      if (h) {
        if (h.kind === 'key') {
          const ref = { kid: h.k.id, holderId: h.tk.holderId, prop: h.tk.prop };
          if (!e.shiftKey && !State.selKeys.some(s => s.kid === h.k.id)) State.selKeys = [ref];
          else if (e.shiftKey) State.selKeys.push(ref);
          $('#interpsel').value = h.k.interp;
          this.drag = { kind: 'key', x, y, orig: State.selKeys.map(s => { const k = Timeline.findKey(s); return { ref: s, t: k ? k.t : 0, v: k ? k.v : 0 }; }) };
        } else this.drag = { kind: 'handle', hitType: h.kind, k: h.k, dx: h.dx, dy: h.dy };
        this.draw(); Timeline.draw();
      } else { this.drag = { kind: 'scrub' }; Player.seek(clamp(Timeline.snapTime(this.x2t(x)), 0, duration())); }
    }, 'graph:down'));
    window.addEventListener('mousemove', guard(e => {
      const d = this.drag; if (!d) return;
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (d.kind === 'scrub') { Player.seek(clamp(Timeline.snapTime(this.x2t(x)), 0, duration())); return; }
      if (d.kind === 'pan') {
        State.tlStart = d.t0 - (x - d.x) / State.tlPxPerSec;
        const dv = (y - d.y) / (this.H - 36) * (d.v1 - d.v0);
        this.vmin = d.v0 + dv; this.vmax = d.v1 + dv;
        this.draw(); Timeline.draw(); return;
      }
      if (d.kind === 'key') {
        const dt = this.x2t(x) - this.x2t(d.x), dv = this.y2v(y) - this.y2v(d.y);
        d.orig.forEach(it => {
          const k = Timeline.findKey(it.ref); if (!k || k.locked) return;
          if (!e.ctrlKey) k.v = round(it.v + dv, 4);
          if (!e.altKey) k.t = round(clamp(Timeline.snapTime(it.t + dt), 0, duration()), 4);
          const h = Timeline.holderOf(it.ref); if (h) h.tracks[it.ref.prop].sort((a, b) => a.t - b.t);
        });
        d.moved = true; this.draw(); Timeline.draw(); Canvas.needRender = true; UI.refreshInspector(); return;
      }
      if (d.kind === 'handle') {
        const kx = this.t2x(d.k.t), ky = this.v2y(d.k.v);
        const nx = clamp((x - kx) / (d.dx || 1), 0, 1);
        const ny = (y - ky) / (d.dy || 1);
        this.applyHandle(d, nx, ny);
        this.draw(); Timeline.draw(); Canvas.needRender = true; return;
      }
    }, 'graph:move'));
    window.addEventListener('mouseup', guard(() => {
      const d = this.drag; this.drag = null;
      if (d && (d.kind === 'key' && d.moved)) commit('カーブ編集');
      if (d && d.kind === 'handle') commit('ハンドル編集');
    }, 'graph:up'));
    cv.addEventListener('wheel', guard(e => {
      e.preventDefault();
      if (e.shiftKey) {
        const c = (this.vmin + this.vmax) / 2, h = (this.vmax - this.vmin) / 2 * (e.deltaY < 0 ? .9 : 1.1);
        this.vmin = c - h; this.vmax = c + h; this.draw();
      } else {
        const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, t0 = this.x2t(mx);
        State.tlPxPerSec = clamp(State.tlPxPerSec * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 4, 4000);
        State.tlStart = t0 - mx / State.tlPxPerSec;
        this.draw(); Timeline.draw();
      }
    }, 'graph:wheel'), { passive: false });
  },
  applyHandle(d, nx, ny) {
    const k = d.k;
    if (k.interp !== 'bezier') k.interp = 'bezier';
    if (d.hitType === 'in') { k.ix = nx; k.iy = ny; }
    else { k.ox = nx; k.oy = ny; }
  }
};

/* ============================================================
   再生
   ============================================================ */
const Player = {
  playing: false, raf: null, last: 0, startTime: 0,
  toggle() { this.playing ? this.stop() : this.play(); },
  play() {
    if (this.playing) return;
    this.playing = true; State.playing = true;
    $('#btn-play').textContent = '⏸';
    this.last = performance.now();
    AudioEngine.playFrom(State.time, State.speed);
    const step = () => {
      if (!this.playing) return;
      const now = performance.now(), dt = (now - this.last) / 1000 * State.speed;
      this.last = now;
      let t = State.time + dt;
      const dur = duration();
      if (t >= dur) {
        if (State.loop) { t = t % dur || 0; AudioEngine.stop(); AudioEngine.playFrom(t, State.speed); }
        else { t = dur; this.stop(); }
      }
      State.time = t;
      this.afterSeek(true);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  stop() {
    this.playing = false; State.playing = false;
    $('#btn-play').textContent = '▶';
    cancelAnimationFrame(this.raf);
    AudioEngine.stop();
  },
  seek(t) {
    State.time = clamp(t, 0, duration());
    if (this.playing) { AudioEngine.stop(); AudioEngine.playFrom(State.time, State.speed); }
    this.afterSeek();
  },
  afterSeek(light) {
    Canvas.needRender = true;
    $('#tcbig').textContent = fmtTime(State.time);
    $('#tcframe').textContent = frameOf(State.time) + ' / ' + frameOf(duration()) + 'f';
    Timeline.draw(); GraphEditor.draw();
    if (!light) { UI.refreshInspector(); } else { UI.refreshInspectorValues(); }
    // 再生ヘッド追従
    const w = Timeline.W, x = Timeline.t2x(State.time);
    if (x > w - 40) State.tlStart += (x - (w - 40)) / State.tlPxPerSec;
    else if (x < 0) State.tlStart = State.time - 1;
  },
  stepFrame(d) { this.stop(); this.seek(timeOfFrame(clamp(frameOf(State.time) + d, 0, frameOf(duration())))); },
  first() { this.seek(0); }, last() { this.seek(duration()); }
};

/* ============================================================
   オーディオ
   ============================================================ */
const AudioEngine = {
  _ctx: null, nodes: [], master: null,
  ctx() {
    if (!this._ctx) {
      this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this._ctx.createGain(); this.master.connect(this._ctx.destination);
    }
    if (this._ctx.state === 'suspended') this._ctx.resume();
    return this._ctx;
  },
  async reloadAll() {
    const s = scene(); if (!s) return;
    for (const a of s.audio) {
      const as = P().assets[a.assetId];
      if (as) { try { await Assets.decodeAudio(as); } catch (e) { reportError(e, '音声の復元'); } }
    }
    Timeline.draw();
  },
  playFrom(t, speed) {
    const s = scene(); if (!s) return;
    const ctx = this.ctx();
    this.stop();
    const anySolo = s.audio.some(a => a.solo);
    s.audio.forEach(a => {
      const buf = Assets.buf[a.assetId]; if (!buf) return;
      if (a.muted || (anySolo && !a.solo)) return;
      const clipEnd = a.start + a.dur / (a.rate || 1);
      if (t >= clipEnd) return;
      const src = ctx.createBufferSource(); src.buffer = buf;
      src.playbackRate.value = (a.rate || 1) * (speed || 1);
      src.loop = !!a.loop;
      const g = ctx.createGain();
      const vol = getProp(a, 'volume', t) * (a.gain == null ? 1 : a.gain);
      g.gain.value = clamp(vol, 0, 3);
      src.connect(g); g.connect(this.master);
      const when = ctx.currentTime + Math.max(0, (a.start - t) / (speed || 1));
      const offIn = t > a.start ? (t - a.start) * (a.rate || 1) : 0;
      const dur = (a.dur - offIn) / (speed || 1);
      // フェード
      const now = when;
      if (a.fadeIn > 0 && t <= a.start + a.fadeIn) {
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(vol, now + (a.start + a.fadeIn - Math.max(t, a.start)) / (speed || 1));
      }
      if (a.fadeOut > 0) {
        const fs = clipEnd - a.fadeOut;
        if (fs > t) { g.gain.setValueAtTime(vol, now + (fs - Math.max(t, a.start)) / (speed || 1)); g.gain.linearRampToValueAtTime(0.0001, now + (clipEnd - Math.max(t, a.start)) / (speed || 1)); }
      }
      try { src.start(when, a.offset + offIn, a.loop ? undefined : Math.max(.01, dur * (speed || 1))); } catch (e) { return; }
      this.nodes.push({ src, g, a });
    });
  },
  stop() { this.nodes.forEach(n => { try { n.src.stop(); } catch (e) { } }); this.nodes = []; },
  preview(a) {
    const buf = Assets.buf[a.assetId]; if (!buf) return;
    const ctx = this.ctx(); const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = .9; src.connect(g); g.connect(this.master);
    src.start(0, a.offset, Math.min(a.dur, 4)); setTimeout(() => { try { src.stop(); } catch (e) { } }, 4200);
  }
};

/* ============================================================
   2D描画ツール
   ============================================================ */
const BRUSH_PRESETS = [
  { name: 'ペン', tool: 'pen', size: 6, hardness: 1, opacity: 1 },
  { name: '鉛筆', tool: 'pencil', size: 3, hardness: 1, opacity: .85 },
  { name: '太ブラシ', tool: 'brush', size: 34, hardness: .35, opacity: .9 },
  { name: 'エアブラシ', tool: 'brush', size: 60, hardness: .05, opacity: .35 },
  { name: 'マーカー', tool: 'brush', size: 18, hardness: .7, opacity: .6 }
];

const Draw = {
  active: false, layer: null, cv: null, ctx: null, last: null, points: [], polyPts: null,

  currentLayer(create) {
    let o = selected().find(x => x.type === 'draw');
    if (!o && create) {
      o = ObjOps.addDrawLayer();
      Toast.show('描画レイヤーを作成しました', o.name);
    }
    return o;
  },
  ensureFrame(o) {
    const f = frameOf(State.time);
    let fr = (o.frames || []).find(x => x.f === f);
    const W = P().settings.width, H = P().settings.height;
    if (!fr) {
      const key = uid('fr');
      const cv = FrameStore.create(W, H);
      // 直前のセルがあれば内容は引き継がない（新規セル）
      FrameStore.put(key, cv);
      fr = { f: f, key: key };
      o.frames.push(fr); o.frames.sort((a, b) => a.f - b.f);
      Timeline.refreshNames();
    } else {
      // コピーオンライト（Undo用に元を保持）
      const old = FrameStore.get(fr.key);
      const key = uid('fr');
      const cv = FrameStore.create(W, H);
      if (old) cv.getContext('2d').drawImage(old, 0, 0);
      FrameStore.put(key, cv); fr.key = key;
    }
    return fr;
  },
  toLocal(o, w) { const inv = M.invert(drawMatrix(o, State.time)); return M.apply(inv, w.x, w.y); },

  begin(w, e) {
    const o = this.currentLayer(true); if (!o) return;
    if (o.locked) { Toast.warn('レイヤーがロックされています'); return; }
    const fr = this.ensureFrame(o);
    this.layer = o; this.cv = FrameStore.get(fr.key); this.ctx = this.cv.getContext('2d', { willReadFrequently: true });
    const p = this.toLocal(o, w);
    if (State.tool === 'fill') { this.floodFill(p); commit('塗りつぶし'); Canvas.needRender = true; return; }
    if (['line', 'rect', 'ellipse'].includes(State.tool)) { Canvas.drag = { kind: 'shape', sx: w.x, sy: w.y, cx: w.x, cy: w.y }; this.active = true; this.shapeStart = p; return; }
    if (State.tool === 'poly') {
      this.polyPts = this.polyPts || [];
      this.polyPts.push(p);
      if (e.detail >= 2 || (this.polyPts.length > 2 && Math.hypot(p.x - this.polyPts[0].x, p.y - this.polyPts[0].y) < 10)) { this.commitPoly(); }
      Canvas.needRender = true; return;
    }
    this.active = true; this.points = [p]; this.last = p;
    this.stamp(p, p);
    Canvas.needRender = true;
  },
  move(w, e) {
    if (!this.active) return;
    const p = this.toLocal(this.layer, w);
    if (Canvas.drag && Canvas.drag.kind === 'shape') { Canvas.drag.cx = w.x; Canvas.drag.cy = w.y; Canvas.needRender = true; return; }
    if (e && e.shiftKey && this.points.length) {
      const a = this.points[0];
      if (Math.abs(p.x - a.x) > Math.abs(p.y - a.y)) p.y = a.y; else p.x = a.x;
    }
    this.stamp(this.last, p);
    this.last = p; this.points.push(p);
    Canvas.needRender = true;
  },
  end() {
    if (!this.active) return;
    if (Canvas.drag && Canvas.drag.kind === 'shape') {
      const d = Canvas.drag, a = this.shapeStart, b = this.toLocal(this.layer, { x: d.cx, y: d.cy });
      this.drawShape(a, b);
    }
    this.active = false; this.points = []; this.last = null;
    commit(State.tool === 'eraser' ? '消しゴム' : '描画');
    Canvas.needRender = true;
  },
  style() {
    const b = State.brush;
    return { size: Math.max(.5, b.size), color: b.color, alpha: clamp(b.opacity, 0, 1), hardness: clamp(b.hardness, 0, 1) };
  },
  stamp(a, b) {
    const g = this.ctx, s = this.style();
    g.save();
    g.globalCompositeOperation = State.tool === 'eraser' ? 'destination-out' : 'source-over';
    g.globalAlpha = s.alpha;
    if (State.tool === 'brush' && s.hardness < .95) {
      const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, s.size * .18)));
      for (let i = 0; i <= steps; i++) {
        const x = lerp(a.x, b.x, i / steps), y = lerp(a.y, b.y, i / steps);
        const r = s.size / 2;
        const gr = g.createRadialGradient(x, y, r * s.hardness, x, y, r);
        gr.addColorStop(0, s.color); gr.addColorStop(1, hexa(s.color, 0));
        g.fillStyle = gr; g.globalAlpha = s.alpha * .35;
        g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
      }
    } else {
      g.strokeStyle = s.color; g.lineWidth = s.size;
      g.lineCap = State.tool === 'pencil' ? 'butt' : 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      if (a.x === b.x && a.y === b.y) { g.fillStyle = s.color; g.beginPath(); g.arc(a.x, a.y, s.size / 2, 0, 6.2832); g.fill(); }
    }
    g.restore();
  },
  drawShape(a, b) {
    const g = this.ctx, s = this.style();
    g.save();
    g.globalCompositeOperation = State.tool === 'eraser' ? 'destination-out' : 'source-over';
    g.globalAlpha = s.alpha; g.strokeStyle = s.color; g.fillStyle = s.color; g.lineWidth = s.size; g.lineJoin = 'round'; g.lineCap = 'round';
    const filled = State.shapeFill;
    g.beginPath();
    if (State.tool === 'line') { g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
    else if (State.tool === 'rect') { g.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)); filled ? g.fill() : g.stroke(); }
    else if (State.tool === 'ellipse') { g.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, 6.2832); filled ? g.fill() : g.stroke(); }
    g.restore();
  },
  commitPoly() {
    if (!this.polyPts || this.polyPts.length < 2) { this.polyPts = null; return; }
    const o = this.currentLayer(true); const fr = this.ensureFrame(o);
    const g = FrameStore.get(fr.key).getContext('2d'), s = this.style();
    g.save(); g.globalAlpha = s.alpha; g.strokeStyle = s.color; g.fillStyle = s.color; g.lineWidth = s.size; g.lineJoin = 'round';
    g.beginPath(); this.polyPts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath();
    State.shapeFill ? g.fill() : g.stroke(); g.restore();
    this.polyPts = null; commit('多角形'); Canvas.needRender = true;
  },
  pick(w) {
    const o = this.currentLayer(false);
    try {
      let src = null;
      if (o) { const fr = currentFrameEntry(o, State.time); if (fr) src = FrameStore.get(fr.key); }
      const c = document.createElement('canvas'); c.width = 1; c.height = 1;
      const g = c.getContext('2d', { willReadFrequently: true });
      if (src) { const p = this.toLocal(o, w); g.drawImage(src, Math.floor(p.x), Math.floor(p.y), 1, 1, 0, 0, 1, 1); }
      else { g.drawImage(Canvas.off, Math.floor(w.x), Math.floor(w.y), 1, 1, 0, 0, 1, 1); }
      const d = g.getImageData(0, 0, 1, 1).data;
      State.brush.color = rgb2hex(d[0], d[1], d[2]);
      UI.refreshInspector(); Toast.ok('色を取得しました', State.brush.color);
    } catch (e) { Toast.warn('色を取得できませんでした'); }
  },
  floodFill(p) {
    const g = this.ctx, W = this.cv.width, H = this.cv.height;
    const x0 = Math.floor(p.x), y0 = Math.floor(p.y);
    if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return;
    const img = g.getImageData(0, 0, W, H), d = img.data;
    const idx = (y0 * W + x0) * 4;
    const tr = d[idx], tg = d[idx + 1], tb = d[idx + 2], ta = d[idx + 3];
    const col = hex2rgb(State.brush.color), alpha = Math.round(clamp(State.brush.opacity, 0, 1) * 255);
    if (tr === col[0] && tg === col[1] && tb === col[2] && ta === alpha) return;
    const tol = 32 * 32 * 3;
    const stack = [y0 * W + x0]; const seen = new Uint8Array(W * H);
    while (stack.length) {
      const i = stack.pop(); if (seen[i]) continue; seen[i] = 1;
      const j = i * 4;
      const dr = d[j] - tr, dg = d[j + 1] - tg, db = d[j + 2] - tb, da = d[j + 3] - ta;
      if (dr * dr + dg * dg + db * db + da * da > tol) continue;
      d[j] = col[0]; d[j + 1] = col[1]; d[j + 2] = col[2]; d[j + 3] = alpha;
      const x = i % W, y = (i / W) | 0;
      if (x > 0) stack.push(i - 1); if (x < W - 1) stack.push(i + 1);
      if (y > 0) stack.push(i - W); if (y < H - 1) stack.push(i + W);
    }
    g.putImageData(img, 0, 0);
  }
};

/* ============================================================
   2Dボーン
   ============================================================ */
const Bones = {
  beginCreate(w) {
    const parent = selected().find(o => o.type === 'bone');
    const o = newObject('bone', 'ボーン ' + (scene().objects.filter(x => x.type === 'bone').length + 1));
    let lx = w.x, ly = w.y;
    if (parent) {
      const base = M.mul(worldMatrix(parent, State.time), M.translate(getProp(parent, 'len', State.time), 0));
      const p = M.apply(M.invert(base), w.x, w.y);
      lx = p.x; ly = p.y; o.parentId = parent.id;
    }
    o.props.x = round(lx, 2); o.props.y = round(ly, 2); o.props.len = 1;
    scene().objects.unshift(o);
    State.selection = [o.id];
    Canvas.drag = { kind: 'bonecreate', o: o, start: w };
    UI.refreshLayers();
  },
  updateCreate(w) {
    const d = Canvas.drag; if (!d || !d.o) return;
    const o = d.o;
    const par = o.parentId ? objById(o.parentId) : null;
    let base = M.id();
    if (par) base = M.mul(worldMatrix(par, State.time), M.translate(getProp(par, 'len', State.time), 0));
    const inv = M.invert(base);
    const a = M.apply(inv, d.start.x, d.start.y), b = M.apply(inv, w.x, w.y);
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    o.props.len = Math.max(1, round(len, 1));
    o.props.rot = round(deg(Math.atan2(b.y - a.y, b.x - a.x)), 2);
    Canvas.needRender = true;
  },
  endCreate() {
    const d = Canvas.drag;
    if (d && d.o && d.o.props.len < 5) { const s = scene(); s.objects = s.objects.filter(o => o.id !== d.o.id); State.selection = []; }
    commit('ボーン作成'); UI.refreshLayers(); UI.refreshInspector(); Timeline.refreshNames();
  },
  /* 2ボーンIK：選択ボーンの先端をターゲットへ */
  solveIK(bone, target) {
    const parent = bone.parentId ? objById(bone.parentId) : null;
    const t = State.time;
    if (!parent || parent.type !== 'bone') {
      // 1ボーン：向きだけ合わせる
      const base = bone.parentId ? worldMatrix(objById(bone.parentId), t) : M.id();
      const inv = M.invert(base);
      const lt = M.apply(inv, target.x, target.y);
      const ox = getProp(bone, 'x', t), oy = getProp(bone, 'y', t);
      setPropValue(bone, 'rot', t, round(deg(Math.atan2(lt.y - oy, lt.x - ox)), 2));
      return;
    }
    const L1 = getProp(parent, 'len', t), L2 = getProp(bone, 'len', t);
    let gbase = M.id();
    const gp = parent.parentId ? objById(parent.parentId) : null;
    if (gp) { gbase = worldMatrix(gp, t); if (gp.type === 'bone') gbase = M.mul(gbase, M.translate(getProp(gp, 'len', t), 0)); }
    const inv = M.invert(gbase);
    const lt = M.apply(inv, target.x, target.y);
    const ox = getProp(parent, 'x', t), oy = getProp(parent, 'y', t);
    const dx = lt.x - ox, dy = lt.y - oy;
    let d = Math.hypot(dx, dy);
    d = clamp(d, Math.abs(L1 - L2) + .01, L1 + L2 - .01);
    const baseAng = Math.atan2(dy, dx);
    const flip = bone.ikFlip ? -1 : 1;
    const a1 = baseAng - flip * Math.acos(clamp((d * d + L1 * L1 - L2 * L2) / (2 * d * L1), -1, 1));
    const a2 = flip * (Math.PI - Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1)));
    setPropValue(parent, 'rot', t, round(deg(a1), 2));
    setPropValue(bone, 'rot', t, round(deg(a2), 2));
  },
  bind(objId, boneId) {
    const o = objById(objId), b = objById(boneId);
    if (!o || !b) return;
    ObjOps.setParent(o, b);
  }
};

/* ============================================================
   オブジェクト操作
   ============================================================ */
const ObjOps = {
  add(o, opts) {
    const s = scene();
    s.objects.unshift(o);
    State.selection = [o.id];
    UI.refreshLayers(); Timeline.refreshNames(); UI.refreshInspector(); Canvas.needRender = true;
    if (!(opts && opts.nocommit)) commit('オブジェクト追加: ' + o.name);
    return o;
  },
  addImage(assetId, pos) {
    const a = P().assets[assetId]; if (!a) return null;
    const o = newObject('image', a.name.replace(/\.[^.]+$/, ''), { assetId: assetId });
    const p = P().settings;
    o.props.x = pos ? round(pos.x, 1) : p.width / 2;
    o.props.y = pos ? round(pos.y, 1) : p.height / 2;
    return this.add(o);
  },
  addSequence(assetIds, name, pos) {
    const o = newObject('sequence', name || '連番アニメ');
    o.assetId = assetIds[0];
    o.frames = assetIds.map((id, i) => ({ f: i, assetId: id }));
    const p = P().settings;
    o.props.x = pos ? pos.x : p.width / 2; o.props.y = pos ? pos.y : p.height / 2;
    return this.add(o);
  },
  addDrawLayer() {
    const o = newObject('draw', '描画レイヤー ' + (scene().objects.filter(x => x.type === 'draw').length + 1));
    o.props.ax = 0; o.props.ay = 0; o.props.x = 0; o.props.y = 0;
    return this.add(o);
  },
  addGroup() {
    const o = newObject('group', 'グループ ' + (scene().objects.filter(x => x.type === 'group').length + 1));
    const p = P().settings; o.props.x = p.width / 2; o.props.y = p.height / 2;
    const sel = selected();
    this.add(o);
    sel.forEach(c => { if (c.id !== o.id) this.setParent(c, o); });
    UI.refreshLayers();
    return o;
  },
  addParticle(preset) {
    const o = newObject('particle', 'エフェクト: ' + preset);
    const p = P().settings; o.props.x = p.width / 2; o.props.y = p.height / 2;
    o.props.ax = .5; o.props.ay = .5;
    initParticle(o, preset);
    return this.add(o);
  },
  addBone() {
    const o = newObject('bone', 'ボーン ' + (scene().objects.filter(x => x.type === 'bone').length + 1));
    const p = P().settings;
    const par = selected().find(x => x.type === 'bone');
    if (par) o.parentId = par.id;
    o.props.x = par ? 0 : p.width / 2; o.props.y = par ? 0 : p.height / 2; o.props.len = 120;
    return this.add(o);
  },
  duplicate(objs, offset) {
    const s = scene(), map = {}, created = [];
    const clone = (o, parentId) => {
      const c = deepClone(o);
      c.id = uid('ob'); c.parentId = parentId;
      c.name = o.name + ' コピー';
      Object.keys(c.tracks).forEach(p => c.tracks[p].forEach(k => k.id = uid('kf')));
      if (c.type === 'draw') {
        c.frames = (o.frames || []).map(f => {
          const nk = uid('fr'), src = FrameStore.get(f.key);
          const cv = FrameStore.create(P().settings.width, P().settings.height);
          if (src) cv.getContext('2d').drawImage(src, 0, 0);
          FrameStore.put(nk, cv); return { f: f.f, key: nk };
        });
      }
      if (offset) { c.props.x += 30; c.props.y += 30; }
      s.objects.unshift(c); map[o.id] = c.id; created.push(c);
      childrenOf(o.id).forEach(ch => clone(ch, c.id));
      return c;
    };
    objs.forEach(o => clone(o, o.parentId));
    State.selection = created.filter(c => objs.some(o => map[o.id] === c.id)).map(c => c.id);
    commit('複製'); UI.refreshLayers(); Timeline.refreshNames(); UI.refreshInspector(); Canvas.needRender = true;
    return created;
  },
  remove(objs) {
    const s = scene(); const ids = new Set();
    const collect = o => { ids.add(o.id); childrenOf(o.id).forEach(collect); };
    objs.forEach(collect);
    s.objects = s.objects.filter(o => !ids.has(o.id));
    State.selection = State.selection.filter(i => !ids.has(i));
    commit('削除'); UI.refreshLayers(); Timeline.refreshNames(); UI.refreshInspector(); Canvas.needRender = true;
  },
  decompose(m) {
    const a = m[0], b = m[1], c = m[2], d = m[3];
    const rot = Math.atan2(b, a);
    const sx = Math.hypot(a, b);
    const det = a * d - b * c;
    const sy = sx ? det / sx : Math.hypot(c, d);
    return { x: m[4], y: m[5], rot: deg(rot), sx: sx, sy: sy };
  },
  setParent(o, parent) {
    if (parent && (parent.id === o.id || isDescendant(parent.id, o.id))) { Toast.warn('その親子関係は設定できません', '自分自身や子孫を親にはできません。'); return; }
    const t = State.time;
    const world = worldMatrix(o, t);
    let base = M.id();
    if (parent) { base = worldMatrix(parent, t); if (parent.type === 'bone') base = M.mul(base, M.translate(getProp(parent, 'len', t), 0)); }
    const local = M.mul(M.invert(base), world);
    const d = this.decompose(local);
    o.parentId = parent ? parent.id : null;
    ['x', 'y', 'rot', 'sx', 'sy'].forEach(k => { if (hasTrack(o, k)) { /* 既存アニメは維持 */ } });
    if (!hasTrack(o, 'x')) o.props.x = round(d.x, 2);
    if (!hasTrack(o, 'y')) o.props.y = round(d.y, 2);
    if (!hasTrack(o, 'rot')) o.props.rot = round(d.rot, 2);
    if (!hasTrack(o, 'sx')) o.props.sx = round(d.sx, 4);
    if (!hasTrack(o, 'sy')) o.props.sy = round(d.sy, 4);
    commit('親子関係の変更'); UI.refreshLayers(); Timeline.refreshNames(); Canvas.needRender = true;
  },
  reorder(o, targetId, before) {
    const s = scene();
    const i = s.objects.indexOf(o); if (i < 0) return;
    s.objects.splice(i, 1);
    let j = s.objects.findIndex(x => x.id === targetId);
    if (j < 0) j = 0; else if (!before) j += 1;
    s.objects.splice(j, 0, o);
    commit('並び替え'); UI.refreshLayers(); Canvas.needRender = true;
  },
  replaceAsset(o, newAssetId) {
    const old = P().assets[o.assetId];
    o.assetId = newAssetId;
    if (o.type === 'sequence') { /* 先頭フレームのみ差し替え */ if (o.frames[0]) o.frames[0].assetId = newAssetId; }
    commit('素材の差し替え');
    UI.refreshInspector(); Canvas.needRender = true;
    Toast.ok('素材を差し替えました', (old ? old.name : '') + ' → ' + P().assets[newAssetId].name + '\n位置・回転・キーフレームは維持されます。');
  },
  copy() {
    const sel = selected(); if (!sel.length) return;
    const ids = new Set(); const collect = o => { ids.add(o.id); childrenOf(o.id).forEach(collect); };
    sel.forEach(collect);
    State.clipboardObjects = scene().objects.filter(o => ids.has(o.id)).map(o => deepClone(o));
    Toast.ok(sel.length + ' 個のオブジェクトをコピーしました');
  },
  paste() {
    const c = State.clipboardObjects; if (!c || !c.length) { Toast.warn('コピーされたオブジェクトがありません'); return; }
    const s = scene(), map = {}, created = [];
    c.forEach(o => {
      const n = deepClone(o); n.id = uid('ob'); map[o.id] = n.id;
      Object.keys(n.tracks).forEach(p => n.tracks[p].forEach(k => k.id = uid('kf')));
      if (n.type === 'draw') n.frames = (n.frames || []).map(f => {
        const nk = uid('fr'), src = FrameStore.get(f.key), cv = FrameStore.create(P().settings.width, P().settings.height);
        if (src) cv.getContext('2d').drawImage(src, 0, 0);
        FrameStore.put(nk, cv); return { f: f.f, key: nk };
      });
      s.objects.unshift(n); created.push(n);
    });
    created.forEach(n => { if (n.parentId && map[n.parentId]) n.parentId = map[n.parentId]; else if (n.parentId && !objById(n.parentId)) n.parentId = null; });
    State.selection = created.map(n => n.id);
    commit('貼り付け'); UI.refreshLayers(); Timeline.refreshNames(); UI.refreshInspector(); Canvas.needRender = true;
  },
  flip(axis) {
    const t = State.time;
    selected().forEach(o => {
      const k = axis === 'x' ? 'sx' : 'sy';
      setPropValue(o, k, t, -getProp(o, k, t));
    });
    commit('反転'); UI.refreshInspector(); Canvas.needRender = true;
  },
  align(how) {
    const p = P().settings, t = State.time;
    selected().forEach(o => {
      if (how === 'hcenter') setPropValue(o, 'x', t, p.width / 2);
      if (how === 'vcenter') setPropValue(o, 'y', t, p.height / 2);
      if (how === 'left') setPropValue(o, 'x', t, 0);
      if (how === 'right') setPropValue(o, 'x', t, p.width);
      if (how === 'top') setPropValue(o, 'y', t, 0);
      if (how === 'bottom') setPropValue(o, 'y', t, p.height);
    });
    commit('整列'); UI.refreshInspector(); Canvas.needRender = true;
  }
};

/* ============================================================
   アセットブラウザ
   ============================================================ */
const AssetsUI = {
  folder: 'root', search: '', selected: null,

  async importFiles(files, dropPos) {
    const imgs = [], auds = [];
    for (const f of files) {
      if (/^image\//.test(f.type)) imgs.push(f);
      else if (/^audio\//.test(f.type) || /\.(mp3|wav|ogg|m4a)$/i.test(f.name)) auds.push(f);
      else Toast.warn('対応していない形式です: ' + f.name, 'PNG / JPEG / WebP / GIF と MP3 / WAV / OGG を読み込めます。');
    }
    const added = [];
    for (const f of imgs) {
      try { const a = await this.addImageFile(f); added.push(a); }
      catch (e) { Toast.err('画像を読み込めません: ' + f.name, e.message + '\nファイルが破損しているか、対応していない形式です。'); }
    }
    for (const f of auds) {
      try { await AudioUI.addFile(f); }
      catch (e) { Toast.err('音声を読み込めません: ' + f.name, e.message + '\n別の形式（MP3/WAV/OGG）でお試しください。'); }
    }
    this.refresh();
    if (!added.length) { if (auds.length) commit('音声の読み込み'); return; }
    // 連番判定
    const seq = detectSequence(added);
    if (seq && seq.length >= 3) {
      UI.confirm('連番PNGとして読み込みますか？', seq.length + ' 枚の連番ファイルを検出しました。\n1枚ずつのレイヤーではなく、1つのフレームアニメーションとして配置できます。',
        () => { ObjOps.addSequence(seq.map(a => a.id), seq[0].name.replace(/[_-]?\d+\.[^.]+$/, ''), dropPos); },
        () => { if (dropPos) added.forEach((a, i) => ObjOps.addImage(a.id, { x: dropPos.x + i * 20, y: dropPos.y + i * 20 })); });
      return;
    }
    if (dropPos) { added.forEach((a, i) => ObjOps.addImage(a.id, { x: dropPos.x + i * 24, y: dropPos.y + i * 24 })); }
    else { commit('アセット追加'); Toast.ok(added.length + ' 個の素材を読み込みました', 'アセットからキャンバスへドラッグして配置できます。'); }
  },

  addImageFile(file) {
    return new Promise((res, rej) => {
      if (file.size > 60 * 1024 * 1024) return rej(new Error('ファイルが大きすぎます（60MBまで）'));
      const fr = new FileReader();
      fr.onload = async () => {
        try {
          const id = uid('as');
          const a = { id: id, type: 'image', name: file.name, folder: this.folder, src: fr.result, size: file.size, w: 0, h: 0, tag: '' };
          registerAssetSrc(id, fr.result);
          P().assets[id] = a;
          await Assets.loadImageAsset(a);   // 幅・高さを取得（元画像そのまま・圧縮なし）
          res(a);
        } catch (e) { rej(e); }
      };
      fr.onerror = () => rej(new Error('ファイルを読み取れませんでした'));
      fr.readAsDataURL(file);   // 元データをそのまま保持（再エンコードしない）
    });
  },

  folderPath(id) {
    const out = []; let f = P().folders.find(x => x.id === id), n = 0;
    while (f && n++ < 20) { out.unshift(f); f = P().folders.find(x => x.id === f.parent); }
    return out;
  },
  refresh() {
    const p = P(); if (!p) return;
    // フォルダバー
    const bar = $('#folderbar');
    const path = this.folderPath(this.folder);
    let h = path.map(f => '<div class="folderrow" data-f="' + f.id + '">📁 ' + esc(f.name) + '</div>').join('<span class="small" style="align-self:center">›</span>');
    const subs = p.folders.filter(f => f.parent === this.folder);
    if (subs.length) h += '<div style="width:100%;height:1px;background:var(--line)"></div>' +
      subs.map(f => '<div class="folderrow" data-f="' + f.id + '" data-drop="1">📂 ' + esc(f.name) + '</div>').join('');
    bar.innerHTML = h;
    $$('#folderbar .folderrow').forEach(el => {
      el.onclick = () => { this.folder = el.dataset.f; this.refresh(); };
      el.oncontextmenu = e => {
        e.preventDefault();
        UI.showContextMenu(e.clientX, e.clientY, [
          ['名前を変更', () => UI.prompt('フォルダ名', p.folders.find(f => f.id === el.dataset.f).name, v => { p.folders.find(f => f.id === el.dataset.f).name = v; commit('フォルダ名変更'); this.refresh(); })],
          ['削除', () => {
            if (el.dataset.f === 'root') return;
            Object.values(p.assets).forEach(a => { if (a.folder === el.dataset.f) a.folder = 'root'; });
            p.folders = p.folders.filter(f => f.id !== el.dataset.f);
            this.folder = 'root'; commit('フォルダ削除'); this.refresh();
          }]
        ]);
      };
    });
    // グリッド
    const q = this.search.toLowerCase();
    const list = Object.values(p.assets).filter(a => q ? (a.name.toLowerCase().includes(q) || (a.tag || '').toLowerCase().includes(q)) : a.folder === this.folder);
    const grid = $('#assetgrid');
    grid.innerHTML = list.map(a => {
      const used = countUsage(a.id);
      return '<div class="acard' + (this.selected === a.id ? ' sel' : '') + '" data-a="' + a.id + '" draggable="true" title="' + esc(a.name) + (a.w ? ' / ' + a.w + '×' + a.h : '') + '">' +
        '<div class="th">' + (a.type === 'audio' ? '<span style="font-size:22px">♪</span>' : '<img loading="lazy" data-src="' + a.id + '">') + '</div>' +
        '<div class="nm">' + esc(a.name) + '</div>' +
        (used ? '<div class="nm" style="color:#6fcf7f">使用中 ' + used + '</div>' : '') + '</div>';
    }).join('') || '<div class="hint" style="grid-column:1/-1">素材がありません。「読み込み」から手描きPNGを追加するか、ファイルをここにドロップしてください。</div>';
    // サムネイル（遅延生成）
    const idle = (typeof requestIdleCallback === 'function') ? requestIdleCallback : (f => setTimeout(f, 30));
    idle(() => this.fillThumbs(grid));
    $$('#assetgrid .acard').forEach(el => {
      const id = el.dataset.a;
      el.onclick = () => { this.selected = id; this.refresh(); };
      el.ondblclick = () => { const a = p.assets[id]; if (a.type === 'image') ObjOps.addImage(id); else AudioUI.addClip(id); };
      el.ondragstart = e => { e.dataTransfer.setData('text/asset', id); e.dataTransfer.effectAllowed = 'copy'; };
      el.oncontextmenu = e => {
        e.preventDefault();
        const a = p.assets[id];
        UI.showContextMenu(e.clientX, e.clientY, [
          ['キャンバスに配置', () => a.type === 'image' ? ObjOps.addImage(id) : AudioUI.addClip(id)],
          ['名前を変更', () => UI.prompt('アセット名', a.name, v => { a.name = v; commit('アセット名変更'); this.refresh(); })],
          ['タグを設定', () => UI.prompt('タグ', a.tag || '', v => { a.tag = v; commit('タグ設定'); this.refresh(); })],
          ['フォルダへ移動', () => UI.selectFolder(fid => { a.folder = fid; commit('アセット移動'); this.refresh(); })],
          ['---'],
          ['選択オブジェクトの素材を差し替え', () => { const o = firstSel(); if (o && (o.type === 'image' || o.type === 'sequence')) ObjOps.replaceAsset(o, id); else Toast.warn('画像オブジェクトを選択してください'); }],
          ['---'],
          ['削除', () => {
            const n = countUsage(id);
            UI.confirm('アセットを削除しますか？', n ? 'このアセットは ' + n + ' 個のオブジェクトで使用されています。削除すると表示されなくなります。' : a.name, () => {
              delete p.assets[id]; commit('アセット削除'); this.refresh(); Canvas.needRender = true;
            });
          }]
        ]);
      };
    });
    // キャンバスへのドロップ
    Canvas.ov.ondragover = e => { e.preventDefault(); };
    Canvas.ov.ondrop = e => {
      const id = e.dataTransfer.getData('text/asset'); if (!id) return;
      e.preventDefault();
      const w = Canvas.mouseWorld(e);
      const a = p.assets[id];
      if (a.type === 'image') ObjOps.addImage(id, w); else AudioUI.addClip(id);
    };
  },
  fillThumbs(grid) {
    $$('#assetgrid img[data-src]').forEach(im => {
      const a = P().assets[im.dataset.src]; if (!a) return;
      const set = () => { const d = Assets.makeThumb(a); if (d) { im.src = d; im.removeAttribute('data-src'); } };
      if (Assets.img[a.id]) set();
      else Assets.loadImageAsset(a).then(set).catch(() => { });
    });
  }
};
function countUsage(assetId) {
  let n = 0;
  P().scenes.forEach(s => s.objects.forEach(o => {
    if (o.assetId === assetId) n++;
    (o.frames || []).forEach(f => { if (f.assetId === assetId) n++; });
  }));
  P().scenes.forEach(s => s.audio.forEach(a => { if (a.assetId === assetId) n++; }));
  return n;
}
function detectSequence(assets) {
  if (assets.length < 3) return null;
  const parsed = assets.map(a => { const m = a.name.match(/^(.*?)(\d+)(\.[^.]+)$/); return m ? { a, base: m[1], num: +m[2] } : null; });
  if (parsed.some(p => !p)) return null;
  const base = parsed[0].base;
  if (!parsed.every(p => p.base === base)) return null;
  parsed.sort((x, y) => x.num - y.num);
  return parsed.map(p => p.a);
}

  refreshLayers() {

      const kids = childrenOf(o.id).length;
      const icon = { image: '🖼', draw: '✎', group: '▣', bone: '⑂', sequence: '🎞', particle: '✦' }[o.type] || '◻';
      return '<div class="lrow' + (State.selection.includes(o.id) ? ' sel' : '') + '" data-o="' + o.id + '" draggable="true" style="padding-left:' + (4 + it.depth * 12) + 'px">' +
        '<span class="tw" data-tw="' + o.id + '">' + (kids ? (State.expandedObjs[o.id] === false ? '▶' : '▼') : '') + '</span>' +
        '<span class="ic">' + icon + '</span>' +
        '<span class="nm">' + esc(o.name) + '</span>' +
        '<span class="tg' + (o.visible ? ' act' : '') + '" data-vis="' + o.id + '" title="表示/非表示">' + (o.visible ? '◉' : '○') + '</span>' +
        '<span class="tg' + (o.locked ? ' act' : '') + '" data-lock="' + o.id + '" title="ロック">' + (o.locked ? '🔒' : '🔓') + '</span>' +
        '</div>';
    }).join('') || '<div class="hint" style="padding:8px">レイヤーがありません。アセットからPNGをキャンバスにドラッグするか、上のボタンで描画レイヤーを追加してください。</div>';
    $$('#layerlist .lrow').forEach(el => {
      const id = el.dataset.o;
      el.onclick = e => {
        if (e.target.dataset.vis) { const o = objById(id); o.visible = !o.visible; commit('表示切替'); this.refreshLayers(); Canvas.needRender = true; return; }
        if (e.target.dataset.lock) { const o = objById(id); o.locked = !o.locked; commit('ロック切替'); this.refreshLayers(); return; }
        if (e.target.dataset.tw) { State.expandedObjs[id] = State.expandedObjs[id] === false ? true : false; this.refreshLayers(); return; }
        if (e.shiftKey && State.selection.length) {
          const ids = orderedObjects().map(x => x.o.id);
          const a = ids.indexOf(State.selection[State.selection.length - 1]), b = ids.indexOf(id);
          State.selection = ids.slice(Math.min(a, b), Math.max(a, b) + 1);
        } else if (e.ctrlKey || e.metaKey) {
          State.selection.includes(id) ? State.selection = State.selection.filter(x => x !== id) : State.selection.push(id);
        } else State.selection = [id];
        this.refreshLayers(); this.refreshInspector(); Timeline.refreshNames(); Timeline.draw(); Canvas.needRender = true;
      };
      el.ondblclick = () => this.renameObject(objById(id));
      el.oncontextmenu = e => { e.preventDefault(); if (!State.selection.includes(id)) { State.selection = [id]; this.refreshLayers(); this.refreshInspector(); } this.objectContextMenu(e); };
      el.ondragstart = e => { e.dataTransfer.setData('text/obj', id); };
      el.ondragover = e => { e.preventDefault(); el.style.borderTop = e.offsetY < 8 ? '2px solid var(--sel)' : ''; el.style.background = e.offsetY >= 8 ? '#2d4a55' : ''; };
      el.ondragleave = () => { el.style.borderTop = ''; el.style.background = ''; };
      el.ondrop = e => {
        e.preventDefault(); el.style.borderTop = ''; el.style.background = '';
        const aid = e.dataTransfer.getData('text/obj');
        const asset = e.dataTransfer.getData('text/asset');
        if (asset) { const o = objById(id); if (o && (o.type === 'image' || o.type === 'sequence')) ObjOps.replaceAsset(o, asset); return; }
        if (!aid || aid === id) return;
        const a = objById(aid), b = objById(id);
        if (e.offsetY < 8) ObjOps.reorder(a, id, true);
        else ObjOps.setParent(a, b);
      };
    });
  },
  renameObject(o) {
    if (!o) return;
    this.prompt('レイヤー名', o.name, v => { o.name = v; commit('名前変更'); this.refreshLayers(); Timeline.refreshNames(); });
  },
  objectContextMenu(e) {
    const o = firstSel();
    const items = [];
    if (o) {
      items.push(['複製', () => ObjOps.duplicate(selected(), true)]);
      items.push(['コピー', () => ObjOps.copy()]);
      items.push(['貼り付け', () => ObjOps.paste()]);
      items.push(['削除', () => ObjOps.remove(selected())]);
      items.push(['---']);
      items.push(['グループ化', () => ObjOps.addGroup()]);
      items.push(['親子関係を解除', () => ObjOps.setParent(o, null)]);
      items.push(['横反転', () => ObjOps.flip('x')]);
      items.push(['縦反転', () => ObjOps.flip('y')]);
      items.push(['---']);
      items.push(['全プロパティにキーを打つ', () => keyAllProps(o)]);
      items.push(['このオブジェクトのキーを全削除', () => { o.tracks = {}; commit('キー全削除'); this.refreshAllTimeline(); }]);
    } else {
      items.push(['描画レイヤーを追加', () => ObjOps.addDrawLayer()]);
      items.push(['グループを追加', () => ObjOps.addGroup()]);
      items.push(['貼り付け', () => ObjOps.paste()]);
    }
    this.showContextMenu(e.clientX, e.clientY, items);
  },

  /* ---------- コンテキストメニュー ---------- */
  showContextMenu(x, y, items) {
    const m = $('#ctxmenu');
    m.innerHTML = items.map((it, i) => it[0] === '---' ? '<div class="msep"></div>' : '<div class="mitem" data-i="' + i + '">' + esc(it[0]) + '</div>').join('');
    m.classList.add('on'); m.style.left = Math.min(x, innerWidth - 200) + 'px'; m.style.top = Math.min(y, innerHeight - m.offsetHeight - 10) + 'px';
    $$('#ctxmenu .mitem').forEach(el => el.onclick = () => { m.classList.remove('on'); try { items[+el.dataset.i][1](); } catch (e) { reportError(e, 'メニュー'); } });
    const close = () => { m.classList.remove('on'); window.removeEventListener('mousedown', close); };
    setTimeout(() => window.addEventListener('mousedown', close), 0);
  },

  /* ---------- ダイアログ ---------- */
  dialog(title, bodyHTML, buttons) {
    $('#dlgtitle').textContent = title;
    $('#dlgbody').innerHTML = bodyHTML;
    const f = $('#dlgfoot'); f.innerHTML = '';
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.textContent = b[0]; if (b[2]) el.className = 'on';
      el.onclick = () => { const keep = b[1] && b[1](); if (!keep) this.closeDialog(); };
      f.appendChild(el);
    });
    $('#modalbg').classList.add('on');
  },
  closeDialog() { $('#modalbg').classList.remove('on'); },
  prompt(title, val, cb) {
    this.dialog(title, '<input type="text" id="promptin" value="' + esc(val) + '">', [['キャンセル', null], ['OK', () => { cb($('#promptin').value); }, true]]);
    setTimeout(() => { const i = $('#promptin'); if (!i) return; i.focus(); i.select(); i.onkeydown = e => { if (e.key === 'Enter') { cb(i.value); this.closeDialog(); } }; }, 30);
  },
  confirm(title, msg, onYes, onNo) {
    this.dialog(title, '<div style="line-height:1.7">' + esc(msg).replace(/\n/g, '<br>') + '</div>',
      [['いいえ', () => { if (onNo) onNo(); }], ['はい', () => onYes(), true]]);
  },
  selectFolder(cb) {
    const opts = P().folders.map(f => '<option value="' + f.id + '">' + esc(AssetsUI.folderPath(f.id).map(x => x.name).join(' / ')) + '</option>').join('');
    this.dialog('フォルダを選択', '<select id="fsel">' + opts + '</select>', [['キャンセル', null], ['移動', () => cb($('#fsel').value), true]]);
  },

  /* ---------- インスペクタ ---------- */
  refreshInspector() {

        }).join('') + '</select></div></div>';

      ['x', 'y', 'rot', 'sx', 'sy', 'skx', 'sky', 'opacity'].forEach(p => h += propRow(o, o.id, p, t));
      if (o.type !== 'bone') { h += propRow(o, o.id, 'ax', t); h += propRow(o, o.id, 'ay', t); }
      if (o.type === 'bone') h += propRow(o, o.id, 'len', t);
      h += propRow(o, o.id, 'visible', t);
      h += '<div class="prow"><label>色</label><div class="f"><input type="color" id="insp-color" value="' + (getProp(o, 'color', t) || '#ffffff') + '">' + '</div>' + keyBtn(o, o.id, 'color', t) + '</div>';
      h += propRow(o, o.id, 'colorAmt', t);
      h += '<div class="grid3" style="margin-top:6px"><button data-align="hcenter">中央X</button><button data-align="vcenter">中央Y</button><button data-flip="x">横反転</button></div>';
      h += sectionEnd();

      if (o.type === 'bone') {
        h += sectionStart('ik', '⑂ ボーン / IK');
        h += '<div class="prow"><label>IK</label><div class="f"><label class="chk"><input type="checkbox" id="insp-ik"' + (o.ik ? ' checked' : '') + '> 先端をドラッグで解決</label></div></div>';
        h += '<div class="prow"><label>曲げ方向</label><div class="f"><button id="insp-ikflip">' + (o.ikFlip ? '反転中' : '標準') + '</button></div></div>';
        h += '<div class="hint">IKをONにしてボーンをドラッグすると、親ボーンと合わせて2ボーンIKで角度を計算します。OFFならFK（個別に回転）になります。</div>';
        h += sectionEnd();
      }
      if (o.type === 'draw') {
        const f = frameOf(t), has = (o.frames || []).some(x => x.f === f);
        h += sectionStart('cells', '🎞 作画セル');
        h += '<div class="prow"><label>現在</label><div class="f"><span class="badge">' + f + 'フレーム目 ' + (has ? '（セルあり）' : '（セルなし）') + '</span></div></div>';
        h += '<div class="grid2"><button id="cell-new">空のセルを作成</button><button id="cell-dup">直前のセルを複製</button>' +
          '<button id="cell-clear">セルを消去</button><button id="cell-del">セルを削除</button></div>';
        h += '<div class="prow" style="margin-top:6px"><label>セル数</label><div class="f"><span class="badge">' + (o.frames || []).length + '</span></div></div>';
        h += sectionEnd();
      }
      if (o.type === 'sequence') {
        h += sectionStart('seq', '🎞 連番フレーム');

        h += '<div class="prow"><label>間隔</label><div class="f"><input type="number" id="seq-step" value="' + (o.seqStep || 1) + '" min="1" step="1"><button id="seq-apply">適用</button></div></div>';
        h += '<div class="hint">間隔を2にすると1枚あたり2フレーム表示（コマ打ち）になります。</div>';

      }
      if (o.type === 'particle') {
        h += sectionStart('pt', '✦ パーティクル');
        h += '<div class="prow"><label>プリセット</label><div class="f"><select id="pt-preset">' +
          Object.keys(PARTICLE_PRESETS).map(k => '<option value="' + k + '"' + (o.particle.preset === k ? ' selected' : '') + '>' + ptLabel(k) + '</option>').join('') + '</select></div></div>';
        PARTICLE_PARAMS.forEach(k => h += propRowRaw(o, o.id, 'pt.' + k, ptParamLabel(k), t));
        h += '<div class="prow"><label>開始時間</label><div class="f"><input type="number" class="num" data-prop="pt.startTime" data-oid="' + o.id + '" value="' + round(getProp(o, 'pt.startTime', t), 3) + '" step="0.1"></div></div>';
        h += '<div class="grid2"><input type="color" id="pt-c1" value="' + o.particle.color + '"><input type="color" id="pt-c2" value="' + o.particle.color2 + '"></div>';
        h += '<label class="chk" style="margin-top:6px"><input type="checkbox" id="pt-add"' + (o.particle.additive ? ' checked' : '') + '> 加算合成</label>';
        h += sectionEnd();
      }

      // エフェクト
      h += sectionStart('fx', '✨ エフェクト');
      h += '<div class="prow"><div class="f"><select id="fx-add"><option value="">エフェクトを追加…</option>' +
        Object.keys(FX_TYPES).map(k => '<option value="' + k + '">' + FX_TYPES[k].label + '</option>').join('') + '</select></div></div>';
      (o.effects || []).forEach((fx, i) => {
        const d = FX_TYPES[fx.type];
        h += '<div class="fxrow"><div class="h"><input type="checkbox" data-fxen="' + fx.id + '"' + (fx.enabled ? ' checked' : '') + ' style="width:auto">' +
          '<b>' + d.label + '</b>' + (d.colors ? '<input type="color" data-fxcolor="' + fx.id + '" value="' + fx.color + '" style="width:26px">' : '') +
          '<button class="iconbtn" data-fxup="' + fx.id + '">↑</button><button class="iconbtn" data-fxdel="' + fx.id + '">×</button></div>';
        Object.keys(d.params).forEach(p => h += propRowRaw(o, o.id, fxKey(fx, p), d.params[p].label, t));
        h += '</div>';
      });
      h += sectionEnd();
    } else {
      h += '<div class="hint" style="padding:12px">オブジェクトが選択されていません。<br><br>' +
        '<b>基本の流れ</b><br>1. アセットタブでPNGを読み込む<br>2. キャンバスへドラッグして配置<br>3. 0秒でプロパティの◆ボタンを押してキーを打つ<br>4. 時間を進めて位置を変える（自動でキーが増えます）<br>5. スペースキーで再生</div>';
    }

    // 音声クリップ
    if (AudioUI.sel) h += AudioUI.section();

    // シーン・表示設定
    h += sectionStart('scene', '🎬 シーン設定');
    h += '<div class="prow"><label>背景色</label><div class="f"><input type="color" id="sc-bg" value="' + scene().bg + '"></div></div>';
    h += '<label class="chk"><input type="checkbox" id="sc-transparent"' + (scene().bgTransparent ? ' checked' : '') + '> 背景を透明にする</label>';
    h += '<div class="prow" style="margin-top:6px"><label>尺（秒）</label><div class="f"><input type="number" id="sc-dur" value="' + duration() + '" min="0.5" step="0.5"></div></div>';
    h += sectionEnd();

    h += sectionStart('onion', '🧅 オニオンスキン');
    h += '<label class="chk"><input type="checkbox" id="on-en"' + (State.onion ? ' checked' : '') + '> 表示する</label>';
    h += '<div class="prow" style="margin-top:6px"><label>前</label><div class="f"><input type="number" id="on-prev" value="' + State.onionPrev + '" min="0" max="10"></div></div>';
    h += '<div class="prow"><label>後</label><div class="f"><input type="number" id="on-next" value="' + State.onionNext + '" min="0" max="10"></div></div>';
    h += '<div class="prow"><label>不透明度</label><div class="f"><input type="range" id="on-alpha" min="0" max="1" step="0.01" value="' + State.onionAlpha + '"></div></div>';
    h += sectionEnd();

    box.innerHTML = h;
    this.bindInspector(o, t);
  },
  refreshInspectorValues() {
    const t = State.time;
    $$('#rightcol input.num[data-prop]').forEach(el => {
      if (document.activeElement === el) return;
      const holder = el.dataset.oid === 'camera' ? scene().camera : objById(el.dataset.oid);
      if (!holder) return;
      const v = getProp(holder, el.dataset.prop, t);
      el.value = typeof v === 'number' ? round(v, 3) : v;
    });
    $$('#rightcol .kbtn[data-prop]').forEach(el => {
      const holder = el.dataset.oid === 'camera' ? scene().camera : objById(el.dataset.oid);
      if (!holder) return;
      el.classList.toggle('has', hasTrack(holder, el.dataset.prop));
      el.classList.toggle('onkey', !!keyAt(holder, el.dataset.prop, t));
    });
  },

  brushSection() {
    const b = State.brush;
    let h = sectionStart('brush', '🖌 ブラシ');
    h += '<div class="prow"><label>プリセット</label><div class="f"><select id="br-preset">' +
      BRUSH_PRESETS.map(p => '<option value="' + p.name + '"' + (b.preset === p.name ? ' selected' : '') + '>' + p.name + '</option>').join('') + '</select></div></div>';
    h += '<div class="prow"><label>サイズ</label><div class="f"><input type="range" id="br-size" min="1" max="200" step="1" value="' + b.size + '"><input type="number" id="br-size-n" value="' + b.size + '" style="width:54px"></div></div>';
    h += '<div class="prow"><label>不透明度</label><div class="f"><input type="range" id="br-op" min="0.02" max="1" step="0.01" value="' + b.opacity + '"></div></div>';
    h += '<div class="prow"><label>硬さ</label><div class="f"><input type="range" id="br-hard" min="0" max="1" step="0.01" value="' + b.hardness + '"></div></div>';
    h += '<div class="prow"><label>色</label><div class="f"><input type="color" id="br-color" value="' + b.color + '"></div></div>';
    h += '<label class="chk"><input type="checkbox" id="br-fill"' + (State.shapeFill ? ' checked' : '') + '> 図形を塗りつぶす</label>';
    h += sectionEnd();
    return h;
  },

  bindInspector(o, t) {
    const on = (sel, ev, fn) => { const el = $(sel); if (el) el[ev] = guard(fn, 'inspector'); };
    // 数値ドラッグ + 入力
    $$('#rightcol input.num[data-prop]').forEach(el => {
      const holder = el.dataset.oid === 'camera' ? scene().camera : objById(el.dataset.oid);
      if (!holder) return;
      const prop = el.dataset.prop;
      const def = PROP_DEFS[prop] || { step: el.step ? +el.step : 1 };
      el.onchange = guard(() => { setPropValue(holder, prop, State.time, +el.value); commit('値の変更'); this.refreshAllTimeline(); }, 'prop');
      el.onmousedown = e => {
        if (e.detail > 1) return;
        let sx = e.clientX, v0 = +el.value, moved = false;
        const mv = ev => {
          if (Math.abs(ev.clientX - sx) < 3 && !moved) return;
          moved = true;
          const d = (ev.clientX - sx) * (def.step || 1) * (ev.shiftKey ? .1 : 1);
          let v = v0 + d;
          if (def.min != null) v = Math.max(def.min, v); if (def.max != null) v = Math.min(def.max, v);
          el.value = round(v, 3);
          setPropValue(holder, prop, State.time, +el.value);
          Canvas.needRender = true; Timeline.draw();
        };
        const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); if (moved) { commit('値の変更'); this.refreshAllTimeline(); } };
        window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
      };
    });
    $$('#rightcol .kbtn[data-prop]').forEach(el => {
      el.onclick = guard(e => {
        const holder = el.dataset.oid === 'camera' ? scene().camera : objById(el.dataset.oid);
        const prop = el.dataset.prop;
        const ex = keyAt(holder, prop, State.time);
        if (ex) { removeKey(holder, prop, State.time); commit('キー削除'); }
        else { setKey(holder, prop, State.time, getProp(holder, prop, State.time)); commit('キー追加'); }
        State.expandedObjs[el.dataset.oid] = true;
        this.refreshAllTimeline();
      }, 'keybtn');
      el.oncontextmenu = e => {
        e.preventDefault();
        const holder = el.dataset.oid === 'camera' ? scene().camera : objById(el.dataset.oid);
        const prop = el.dataset.prop;
        this.showContextMenu(e.clientX, e.clientY, [
          ['このプロパティのキーを全削除', () => { delete holder.tracks[prop]; commit('キー削除'); this.refreshAllTimeline(); }],
          ['グラフエディターで表示', () => { State.graphProp = { holderId: el.dataset.oid, prop: prop }; showGraph(true); }]
        ]);
      };
    });
    on('#insp-name', 'onchange', () => { o.name = $('#insp-name').value; commit('名前変更'); this.refreshLayers(); Timeline.refreshNames(); });
    on('#insp-blend', 'onchange', () => { o.blend = $('#insp-blend').value; commit('合成モード'); Canvas.needRender = true; });
    on('#insp-color', 'oninput', () => { setPropValue(o, 'color', State.time, $('#insp-color').value); if (getProp(o, 'colorAmt', State.time) === 0) setPropValue(o, 'colorAmt', State.time, 1); Canvas.needRender = true; });
    on('#insp-color', 'onchange', () => { commit('色の変更'); this.refreshAllTimeline(); });
    on('#insp-replace', 'onclick', () => {
      const imgs = Object.values(P().assets).filter(a => a.type === 'image');
      if (!imgs.length) { Toast.warn('差し替え先の素材がありません'); return; }

/* ---------- モーションプリセット ---------- */
const Presets = {
  save() {
    const o = firstSel(); if (!o) { Toast.warn('オブジェクトを選択してください'); return; }
    if (!Object.keys(o.tracks).length) { Toast.warn('キーフレームがありません'); return; }
    UI.prompt('モーション名', o.name + 'の動き', v => {
      const t0 = Math.min.apply(null, Object.keys(o.tracks).map(p => o.tracks[p][0].t));
      const tracks = deepClone(o.tracks);
      Object.keys(tracks).forEach(p => tracks[p].forEach(k => { k.t = round(k.t - t0, 4); k.id = uid('kf'); }));
      P().presets = P().presets || [];
      P().presets.push({ name: v, tracks: tracks, base: deepClone(o.props) });
      commit('モーション保存'); UI.refreshScenes(); Toast.ok('モーションを保存しました', v);
    });
  },
  apply(i, additive) {
    const pr = P().presets[i]; const objs = selected();
    if (!objs.length) { Toast.warn('適用先のオブジェクトを選択してください'); return; }
    objs.forEach(o => {
      if (!additive) { Object.keys(pr.tracks).forEach(p => delete o.tracks[p]); }
      Object.keys(pr.tracks).forEach(p => {
        o.tracks[p] = o.tracks[p] || [];
        const baseV = getProp(o, p, State.time);
        const prBase = pr.base[p] !== undefined ? pr.base[p] : 0;
        pr.tracks[p].forEach(k => {
          const nk = deepClone(k); nk.id = uid('kf'); nk.t = round(State.time + k.t, 4);
          if (typeof nk.v === 'number' && ['x', 'y'].includes(p)) nk.v = baseV + (k.v - prBase);
          const ex = o.tracks[p].findIndex(x => Math.abs(x.t - nk.t) < 1e-4);
          if (ex >= 0) o.tracks[p].splice(ex, 1);
          o.tracks[p].push(nk);
        });
        o.tracks[p].sort((a, b) => a.t - b.t);
      });
    });
    commit('モーション適用: ' + pr.name); UI.refreshAllTimeline();
    Toast.ok('モーションを適用しました', pr.name);
  }
};

/* ---------- ZIP（無圧縮 store） ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {  // files: [{name, data:Uint8Array}]
  const chunks = [], central = [];
  let offset = 0;
  const enc = new TextEncoder();
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const local = new Uint8Array(30 + name.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    local.set(name, 30);
    chunks.push(local, f.data);
    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x800, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    cen.set(name, 46);
    central.push(cen);
    offset += local.length + size;
  });
  let cenSize = 0; central.forEach(c => cenSize += c.length);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true); ev.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [end]), { type: 'application/zip' });
}

/* ---------- GIF エンコーダ ---------- */
function medianCut(samples, maxColors) {
  let boxes = [{ px: samples }];
  const bounds = b => {
    let rmin = 255, rmax = 0, gmin = 255, gmax = 0, bmin = 255, bmax = 0;
    for (let i = 0; i < b.px.length; i += 3) {
      const r = b.px[i], g = b.px[i + 1], bl = b.px[i + 2];
      if (r < rmin) rmin = r; if (r > rmax) rmax = r;
      if (g < gmin) gmin = g; if (g > gmax) gmax = g;
      if (bl < bmin) bmin = bl; if (bl > bmax) bmax = bl;
    }
    return { r: rmax - rmin, g: gmax - gmin, b: bmax - bmin };
  };
  while (boxes.length < maxColors) {
    let bi = -1, best = -1;
    boxes.forEach((b, i) => { if (b.px.length < 6) return; const d = bounds(b); const m = Math.max(d.r, d.g, d.b); if (m > best) { best = m; bi = i; } });
    if (bi < 0) break;
    const b = boxes[bi], d = bounds(b);
    const ch = d.r >= d.g && d.r >= d.b ? 0 : (d.g >= d.b ? 1 : 2);
    const n = b.px.length / 3, idx = [];
    for (let i = 0; i < n; i++) idx.push(i);
    idx.sort((x, y) => b.px[x * 3 + ch] - b.px[y * 3 + ch]);
    const half = Math.floor(n / 2);
    const mk = list => { const a = new Uint8Array(list.length * 3); list.forEach((v, i) => { a[i * 3] = b.px[v * 3]; a[i * 3 + 1] = b.px[v * 3 + 1]; a[i * 3 + 2] = b.px[v * 3 + 2]; }); return { px: a }; };
    boxes.splice(bi, 1, mk(idx.slice(0, half)), mk(idx.slice(half)));
  }
  return boxes.map(b => {
    let r = 0, g = 0, bl = 0, n = b.px.length / 3;
    for (let i = 0; i < b.px.length; i += 3) { r += b.px[i]; g += b.px[i + 1]; bl += b.px[i + 2]; }

function lzwEncode(indices, minCodeSize, out) {
  const clearCode = 1 << minCodeSize, eoi = clearCode + 1;
  let codeSize = minCodeSize + 1, next = eoi + 1;
  let dict = new Map(), cur = 0, curBits = 0;
  const bytes = [];
  const emit = code => {
    cur |= code << curBits; curBits += codeSize;
    while (curBits >= 8) { bytes.push(cur & 255); cur >>= 8; curBits -= 8; }
  };
  emit(clearCode);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i], key = prefix * 4096 + k;
    if (dict.has(key)) { prefix = dict.get(key); continue; }
    emit(prefix);
    dict.set(key, next++);
    if (next > (1 << codeSize)) { if (codeSize < 12) codeSize++; }
    if (next >= 4095) { emit(clearCode); dict = new Map(); next = eoi + 1; codeSize = minCodeSize + 1; }
    prefix = k;
  }
  emit(prefix); emit(eoi);
  if (curBits > 0) bytes.push(cur & 255);
  // サブブロック化
  out.push(minCodeSize);
  for (let i = 0; i < bytes.length; i += 255) {
    const n = Math.min(255, bytes.length - i);
    out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]);
  }
  out.push(0);
}
function encodeGIF(frames, W, H, delayCs, transparent) {
  // パレット構築（全フレームからサンプリング）
  const samples = [];
  frames.forEach(f => {
    const d = f.data;
    const stepN = Math.max(4, Math.floor(d.length / 4 / 6000)) * 4;
    for (let i = 0; i < d.length; i += stepN) { if (d[i + 3] > 128) { samples.push(d[i], d[i + 1], d[i + 2]); } }
  });
  const maxColors = transparent ? 255 : 256;
  const pal = samples.length ? medianCut(new Uint8Array(samples), maxColors) : [[0, 0, 0]];
  while (pal.length < 2) pal.push([0, 0, 0]);
  const transIdx = transparent ? pal.length : -1;
  if (transparent) pal.push([0, 0, 0]);
  const palSize = Math.max(2, Math.pow(2, Math.ceil(Math.log2(pal.length))));
  const cache = new Map();
  const nearest = (r, g, b) => {
    const key = (r >> 2) << 12 | (g >> 2) << 6 | (b >> 2);
    const c = cache.get(key); if (c !== undefined) return c;
    let bi = 0, bd = Infinity;
    for (let i = 0; i < pal.length; i++) {
      if (i === transIdx) continue;
      const dr = pal[i][0] - r, dg = pal[i][1] - g, db = pal[i][2] - b;
      const d = dr * dr * 3 + dg * dg * 6 + db * db;
      if (d < bd) { bd = d; bi = i; }
    }
    cache.set(key, bi); return bi;
  };
  const out = [];
  const push = (...a) => a.forEach(v => out.push(v));
  const str = s => { for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i)); };
  str('GIF89a');
  push(W & 255, W >> 8, H & 255, H >> 8);
  const gctSizeBits = Math.log2(palSize) - 1;
  push(0xF0 | gctSizeBits, 0, 0);
  for (let i = 0; i < palSize; i++) { const c = pal[i] || [0, 0, 0]; push(c[0], c[1], c[2]); }
  // ループ
  push(0x21, 0xFF, 11); str('NETSCAPE2.0'); push(3, 1, 0, 0, 0);
  frames.forEach(f => {
    push(0x21, 0xF9, 4, transparent ? 0x09 : 0x04, delayCs & 255, delayCs >> 8, transparent ? transIdx : 0, 0);
    push(0x2C, 0, 0, 0, 0, W & 255, W >> 8, H & 255, H >> 8, 0);
    const d = f.data, n = W * H, idx = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const j = i * 4;
      idx[i] = (transparent && d[j + 3] < 128) ? transIdx : nearest(d[j], d[j + 1], d[j + 2]);
    }
    lzwEncode(idx, Math.max(2, Math.ceil(Math.log2(palSize))), out);
  });
  push(0x3B);
  return new Blob([new Uint8Array(out)], { type: 'image/gif' });
}

/* ---------- 書き出し本体 ---------- */
const Exporter = {
  busy: false,
  dialog() {
    const p = P();
    const h = `
    <div class="grid2">
      <div><label class="small">形式</label>
        <select id="ex-format">
          <option value="png">PNG（現在フレーム）</option>
          <option value="seq">連番PNG（ZIP）</option>

          <option value="webm">WebM 動画</option>
          <option value="mp4">MP4 動画</option>
          <option value="proj">プロジェクトファイル（.k2d.json）</option>
        </select></div>
      <div><label class="small">FPS</label><input type="number" id="ex-fps" value="${p.settings.fps}" min="1" max="120"></div>
      <div><label class="small">幅</label><input type="number" id="ex-w" value="${p.settings.width}"></div>
      <div><label class="small">高さ</label><input type="number" id="ex-h" value="${p.settings.height}"></div>
      <div><label class="small">開始（秒）</label><input type="number" id="ex-t0" value="0" step="0.1" min="0"></div>
      <div><label class="small">終了（秒）</label><input type="number" id="ex-t1" value="${duration()}" step="0.1"></div>
      <div><label class="small">品質</label><select id="ex-q"><option value="0.7">標準</option><option value="0.9" selected>高</option><option value="1">最高</option></select></div>
      <div><label class="small">倍率</label><select id="ex-scale"><option value="1" selected>100%</option><option value="0.5">50%</option><option value="0.25">25%</option><option value="2">200%</option></select></div>
    </div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="ex-alpha"> 透明背景で書き出す（PNG・連番PNG・GIF）</label>
    <div class="hint" id="ex-note"></div>
    <div id="progwrap"><div id="progbar"></div></div>
    <div class="small" id="ex-status"></div>`;
    UI.dialog('書き出し', h, [['閉じる', null], ['書き出す', () => { this.run(); return true; }, true]]);
    const note = () => {
      const f = $('#ex-format').value;
      const msgs = {
        png: '現在の再生ヘッド位置を1枚のPNGとして保存します。',
        seq: '全フレームをPNGにしてZIPにまとめます。透明背景に対応し、他ソフトへの受け渡しに最適です。',
        gif: '256色に減色して書き出します。透明背景に対応しますが、半透明は表現できません。',
        webm: 'ブラウザの録画機能（MediaRecorder）で書き出します。実時間で処理するため、尺と同じ時間がかかります。',
        mp4: MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/mp4') ? 'このブラウザはMP4に対応しています。実時間で書き出します。' : 'このブラウザはMP4録画に非対応です。書き出すとWebMになります（変換は別途動画ソフトをご利用ください）。',
        proj: '編集状態をすべて含む .k2d.json ファイルを保存します。ファイル→プロジェクトを開く で読み込めます。'
      };
      $('#ex-note').textContent = msgs[f] || '';
    };
    setTimeout(() => { const el = $('#ex-format'); if (!el) return; el.onchange = note; note(); }, 20);
  },
  prog(v, msg) {
    const b = $('#progbar'); if (b) b.style.width = Math.round(v * 100) + '%';
    const s = $('#ex-status'); if (s) s.textContent = msg || '';
  },
  renderFrameTo(ctx, t, w, h, alpha) {
    const p = P();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const sc = w / p.settings.width;
    ctx.scale(sc, sc);
    const keep = scene().bgTransparent;
    if (alpha) scene().bgTransparent = true;
    renderScene(ctx, t, { forExport: true, transparent: alpha });
    scene().bgTransparent = keep;
    ctx.restore();
  },
  async run() {
    if (this.busy) { Toast.warn('書き出し処理中です'); return; }
    const f = $('#ex-format').value;
    const scl = +$('#ex-scale').value;
    const w = Math.max(2, Math.round(+$('#ex-w').value * scl)), h = Math.max(2, Math.round(+$('#ex-h').value * scl));
    const efps = clamp(+$('#ex-fps').value || fps(), 1, 120);
    const t0 = Math.max(0, +$('#ex-t0').value), t1 = Math.min(duration(), +$('#ex-t1').value);
    const alpha = $('#ex-alpha').checked, q = +$('#ex-q').value;
    if (t1 <= t0 && f !== 'png' && f !== 'proj') { Toast.err('書き出し範囲が不正です', '終了時間は開始時間より後にしてください。'); return; }
    this.busy = true;
    const wasPlaying = Player.playing; Player.stop();
    try {
      if (f === 'proj') { await saveProjectFile(); }
      else if (f === 'png') await this.exportPNG(w, h, alpha);
      else if (f === 'seq') await this.exportSequence(w, h, efps, t0, t1, alpha);
      else if (f === 'gif') await this.exportGIF(w, h, efps, t0, t1, alpha);
      else await this.exportVideo(w, h, efps, t0, t1, f === 'mp4', q);
    } catch (e) {
      reportError(e, '書き出し');
      Toast.err('書き出しに失敗しました', e.message + '\n解像度やフレーム数を下げて再度お試しください。');
    }
    this.busy = false; this.prog(0, '');
    if (wasPlaying) Player.play();
  },
  makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  async exportPNG(w, h, alpha) {
    const c = this.makeCanvas(w, h);
    this.renderFrameTo(c.getContext('2d'), State.time, w, h, alpha);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    await downloadBlob(blob, P().name + '_' + String(frameOf(State.time)).padStart(4, '0') + '.png');
    Toast.ok('PNGを書き出しました');
  },
  async exportSequence(w, h, efps, t0, t1, alpha) {
    const c = this.makeCanvas(w, h), ctx = c.getContext('2d');
    const n = Math.max(1, Math.round((t1 - t0) * efps));
    const files = [];
    for (let i = 0; i < n; i++) {
      this.renderFrameTo(ctx, t0 + i / efps, w, h, alpha);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      files.push({ name: P().name + '_' + String(i).padStart(4, '0') + '.png', data: new Uint8Array(await blob.arrayBuffer()) });
      this.prog(i / n, '書き出し中 ' + (i + 1) + ' / ' + n + ' フレーム');
      if (i % 4 === 0) await new Promise(r => setTimeout(r));
    }
    this.prog(1, 'ZIPを作成中…');
    await downloadBlob(makeZip(files), P().name + '_png_sequence.zip');
    Toast.ok('連番PNGを書き出しました', n + ' フレーム');
  },
  async exportGIF(w, h, efps, t0, t1, alpha) {
    const gfps = Math.min(efps, 50);
    const c = this.makeCanvas(w, h), ctx = c.getContext('2d', { willReadFrequently: true });
    const n = Math.max(1, Math.round((t1 - t0) * gfps));
    if (n > 600) throw new Error('フレーム数が多すぎます（' + n + '）。範囲を短くするかFPSを下げてください。');
    const frames = [];
    for (let i = 0; i < n; i++) {
      this.renderFrameTo(ctx, t0 + i / gfps, w, h, alpha);
      frames.push({ data: ctx.getImageData(0, 0, w, h).data });
      this.prog(i / n * .7, 'フレーム取得 ' + (i + 1) + ' / ' + n);
      if (i % 3 === 0) await new Promise(r => setTimeout(r));
    }
    this.prog(.75, 'GIFをエンコード中…');
    await new Promise(r => setTimeout(r, 20));
    const blob = encodeGIF(frames, w, h, Math.round(100 / gfps), alpha);
    await downloadBlob(blob, P().name + '.gif');
    Toast.ok('GIFを書き出しました', n + ' フレーム / ' + bytes(blob.size));
  },
  async exportVideo(w, h, efps, t0, t1, wantMp4, q) {
    const c = this.makeCanvas(w, h), ctx = c.getContext('2d');
    let mime = 'video/webm;codecs=vp9';
    if (wantMp4 && MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
    else if (!MediaRecorder.isTypeSupported(mime)) mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm';
    const stream = c.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(w * h * efps * 0.12 * q) });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise(r => rec.onstop = r);
    rec.start();
    const n = Math.max(1, Math.round((t1 - t0) * efps));
    const dt = 1000 / efps;
    let start = performance.now();
    for (let i = 0; i < n; i++) {
      this.renderFrameTo(ctx, t0 + i / efps, w, h, false);
      if (track.requestFrame) track.requestFrame();
      this.prog(i / n, '録画中 ' + (i + 1) + ' / ' + n + ' フレーム（実時間で処理しています）');
      const target = start + (i + 1) * dt;
      await new Promise(r => setTimeout(r, Math.max(0, target - performance.now())));
    }
    await new Promise(r => setTimeout(r, 200));
    rec.stop(); await done;
    const blob = new Blob(chunks, { type: mime });
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    await downloadBlob(blob, P().name + '.' + ext);
    if (wantMp4 && ext === 'webm') Toast.warn('WebMで書き出しました', 'このブラウザはMP4録画に対応していないため、WebM形式で保存しました。');
    else Toast.ok((ext.toUpperCase()) + 'を書き出しました', bytes(blob.size));
  }
};
